<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한월(韓月) - 로비</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        *{box-sizing:border-box}
        body{margin:0;overflow:hidden;background:#0a0e1a;font-family:'Pretendard',sans-serif;color:#fff}
        .serif{font-family:'Gowun Batang',serif}

        /* 배경: 단순 이미지 + 다크 오버레이 (블러 X) */
        .bg-layer{position:absolute;inset:0;z-index:0}
        .bg-layer img{width:100%;height:100%;object-fit:cover;opacity:.45}

        /* 캐릭터 마스크 */
        .char-wrap{
            position:absolute;bottom:0;left:50%;transform:translateX(-55%);
            height:92vh;z-index:2;pointer-events:none;
            -webkit-mask-image:linear-gradient(to bottom,#000 65%,transparent);
            mask-image:linear-gradient(to bottom,#000 65%,transparent);
        }
        .char-wrap img{height:100%;object-fit:contain}

        /* 공통 패널 */
        .panel{background:rgba(10,14,26,.8);border:1px solid rgba(255,255,255,.08);border-radius:9999px}
        .panel-box{background:rgba(10,14,26,.85);border:1px solid rgba(255,255,255,.08);border-radius:12px}

        /* 상단 네비게이션 버튼 */
        .top-nav-btn {
            position: relative; width: 46px; height: 46px; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: rgba(255,255,255,.7); cursor: pointer;
            background: rgba(10,14,26,.65); border: 1px solid rgba(255,255,255,.1);
            transition: all .2s;
            backdrop-filter: blur(4px);
        }
        .top-nav-btn:hover { background: rgba(255,255,255,.15); color: #fff; transform: translateY(-2px); border-color: rgba(255,255,255,.3); }
        .top-nav-btn i { margin-bottom: 2px; }
        .top-nav-label { font-size: 0.65rem; font-weight: 700; letter-spacing: -0.5px; opacity: 0.8; }
        .top-nav-btn:hover .top-nav-label { opacity: 1; }

        /* 스큐 버튼 */
        .skew{transform:skewX(-12deg);transition:background .15s}
        .skew-inner{transform:skewX(12deg)}
        .btn-main{background:#b45309;border-right:3px solid #fbbf24}
        .btn-main:hover{background:#d97706}
        .btn-sub{background:rgba(20,27,45,.95);border:1px solid rgba(255,255,255,.08);border-right:3px solid #a78bfa}
        .btn-sub:hover{background:rgba(40,50,70,.95)}

        /* 편성 카드 */
        .r-card{
            flex:1;position:relative;border-radius:8px;overflow:hidden;
            background:rgba(15,20,30,.95);border:1px solid rgba(255,255,255,.06);
            cursor:pointer;transition:transform .15s,border-color .15s;
        }
        .r-card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.25)}
        .r-card img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
        .r-card-info{
            position:absolute;bottom:0;left:0;right:0;padding:24px 16px 16px;
            background:linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,.3) 80%,transparent);
        }
        .r-empty{
            display:flex;align-items:center;justify-content:center;flex-direction:column;
            color:rgba(255,255,255,.2);border:2px dashed rgba(255,255,255,.15);
        }
        .r-empty:hover{border-style:solid;color:rgba(255,255,255,.5);background:rgba(255,255,255,.03)}
    </style>
</head>
<body x-data="lobbyApp()">

<!-- 배경 -->
<div class="bg-layer">
    <img src="/images/bg_estate_peace.png" alt="bg" loading="eager">
</div>

<!-- 로딩 스피너 -->
<div x-show="isLoading" class="fixed inset-0 z-[100] bg-[#0a0e1a] flex items-center justify-center">
    <div class="text-center">
        <div class="w-10 h-10 border-2 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-slate-400 text-sm tracking-widest serif">입장 중...</p>
    </div>
</div>

<!-- 캐릭터 -->
<div class="char-wrap">
    <img :src="currentLobbyCharacter.src" :alt="currentLobbyCharacter.name" loading="lazy">
</div>

<!-- 캐릭터 정보 (제거됨) -->

<!-- UI 오버레이 -->
<div class="relative z-10 w-screen h-screen flex flex-col justify-between pointer-events-none" x-show="!isLoading">

    <!-- 상단 헤더 -->
    <header class="flex justify-between items-start p-5 pointer-events-auto">
        <button @click="openModal('MY_PROFILE')" class="panel pr-5 pl-2 py-1.5 flex items-center gap-3 cursor-pointer hover:bg-white/10 transition text-left">
            <div class="w-11 h-11 rounded-full border border-amber-500 overflow-hidden bg-black/60 shrink-0">
                <img :src="playerPortrait" alt="avatar" class="w-full h-full object-cover">
            </div>
            <div>
                <div class="flex items-center gap-1.5">
                    <span class="bg-amber-600 text-[10px] px-1.5 rounded font-bold">Lv.<span x-text="playerLevel"></span></span>
                    <span class="font-bold text-base serif" x-text="playerNickname"></span>
                </div>
                <div class="text-slate-500 text-[10px]">UID: 800012345</div>
            </div>
        </button>

        <div class="flex flex-col items-end gap-3">
            <div class="flex gap-3 items-center">
                <div class="panel px-3.5 py-1 flex items-center gap-1.5">
                    <i data-lucide="coins" class="text-yellow-500 w-3.5 h-3.5"></i>
                    <span class="font-mono text-sm" x-text="playerGold.toLocaleString()"></span>
                </div>
                <div class="panel px-3.5 py-1 flex items-center gap-1.5">
                    <i data-lucide="gem" class="text-cyan-400 w-3.5 h-3.5"></i>
                    <span class="font-mono text-sm" x-text="playerGems.toLocaleString()"></span>
                </div>
                <div class="flex gap-1.5 ml-2">
                    <button class="w-9 h-9 rounded-full bg-black/40 flex items-center justify-center text-slate-400 hover:text-white transition">
                        <i data-lucide="mail" class="w-4 h-4"></i>
                    </button>
                    <button class="w-9 h-9 rounded-full bg-black/40 flex items-center justify-center text-slate-400 hover:text-white transition">
                        <i data-lucide="settings" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- 신규 상단 메뉴 -->
            <div class="flex gap-2">
                <button @click="openModal('GACHA')" class="top-nav-btn group">
                    <i data-lucide="sparkles" class="w-4 h-4 text-amber-300 group-hover:text-amber-400"></i>
                    <span class="top-nav-label text-amber-100">객잔</span>
                </button>
                <button @click="openModal('TOWER')" class="top-nav-btn group">
                    <i data-lucide="castle" class="w-4 h-4 text-cyan-300 group-hover:text-cyan-400"></i>
                    <span class="top-nav-label text-cyan-100">무한탑</span>
                </button>
                <button @click="openModal('RAID')" class="top-nav-btn group">
                    <i data-lucide="flame" class="w-4 h-4 text-red-400 group-hover:text-red-500"></i>
                    <span class="top-nav-label text-red-100">레이드</span>
                </button>
                <button @click="openModal('PARTY')" class="top-nav-btn group">
                    <i data-lucide="users" class="w-4 h-4 text-blue-300 group-hover:text-blue-400"></i>
                    <span class="top-nav-label text-blue-100">편성</span>
                </button>
                <button @click="openModal('INVENTORY')" class="top-nav-btn group">
                    <i data-lucide="package" class="w-4 h-4 text-slate-300 group-hover:text-white"></i>
                    <span class="top-nav-label text-slate-200">보따리</span>
                </button>
                <button @click="openModal('GUILD')" class="top-nav-btn group">
                    <i data-lucide="shield" class="w-4 h-4 text-green-300 group-hover:text-green-400"></i>
                    <span class="top-nav-label text-green-100">문파</span>
                </button>
            </div>

            <!-- 퀘스트 바 가이드 영역 -->
            <div @click="handleQuestClick()" class="mt-4 flex flex-col items-end group cursor-pointer pointer-events-auto">
                <div class="panel-box px-4 py-2 bg-black/60 border-amber-500/30 flex items-center gap-3 hover:bg-black/80 transition-all hover:translate-x-[-4px] shadow-lg">
                    <div class="flex flex-col text-right">
                        <div class="flex items-center justify-end gap-1.5 mb-0.5">
                            <span class="text-[10px] bg-amber-600/20 text-amber-300 px-1.5 rounded font-bold uppercase tracking-widest" x-text="currentQuest.category"></span>
                            <span class="text-xs font-bold text-slate-400" x-text="currentQuest.title"></span>
                        </div>
                        <div class="text-sm font-bold text-white serif tracking-wide group-hover:text-amber-400 transition-colors" x-text="currentQuest.goal"></div>
                    </div>
                    <div class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center">
                        <i data-lucide="flag" class="w-4 h-4 text-amber-500"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>



    <!-- 우하단 메인 버튼 -->
    <div class="absolute bottom-8 right-0 flex flex-col gap-2.5 pointer-events-auto">
        <button @click="openModal('DUNGEON')" class="skew btn-sub w-64 h-14 mr-[-16px] flex items-center justify-end pr-8 cursor-pointer">
            <div class="skew-inner flex items-center gap-3">
                <div class="text-right">
                    <div class="text-purple-300 text-[10px] font-bold tracking-widest uppercase">일일 수련</div>
                    <div class="text-white font-bold serif text-base">기억의 전당</div>
                </div>
                <i data-lucide="swords" class="text-purple-400 w-5 h-5"></i>
            </div>
        </button>
        <button @click="goToStory()" class="skew btn-main w-72 h-20 mr-[-16px] flex items-center justify-end pr-10 cursor-pointer group">
            <div class="skew-inner flex items-center gap-4">
                <div class="text-right">
                    <div class="text-amber-200 text-[10px] font-bold tracking-[.2em] uppercase">Main Story</div>
                    <div class="text-white font-extrabold serif text-2xl">임무 시작</div>
                </div>
                <i data-lucide="navigation" class="text-white w-6 h-6 rotate-45 transition-transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5"></i>
            </div>
        </button>
    </div>

    <!-- 모달 영역 -->
    <div x-show="currentModal" style="display:none"
         class="absolute inset-0 z-50 flex items-center justify-center pointer-events-auto"
         :class="currentModal==='PARTY' ? 'bg-[#060a12]/97 p-6' : 'bg-black/80 p-4'"
         x-transition.opacity.duration.200ms>

        <!-- 편성창 -->
        <template x-if="currentModal==='PARTY'">
            <div class="w-full h-full flex flex-col pt-8 px-8">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-3xl font-bold serif">출진 편성</h2>
                        <p class="text-amber-300/60 text-xs tracking-widest mt-1 uppercase">Formation Setup</p>
                    </div>
                    <button @click="closeModal()" class="w-10 h-10 rounded-full bg-slate-800/80 border border-white/20 text-slate-300 flex items-center justify-center hover:bg-red-500 hover:text-white hover:border-red-500 transition-all z-10 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
                <div class="flex-1 flex gap-5">
                    <template x-for="(char, i) in currentParty" :key="i">
                        <div class="r-card" :class="!char && 'r-empty'" style="height:72vh">
                            <template x-if="char">
                                <div class="w-full h-full relative">
                                    <div class="absolute top-3 left-3 z-10 px-2.5 py-0.5 rounded text-[11px] font-bold text-white" :class="char.color" x-text="char.role"></div>
                                    <img :src="char.src" :alt="char.name" loading="lazy">
                                </div>
                            </template>
                            <template x-if="!char">
                                <div class="text-center">
                                    <i data-lucide="plus" class="w-12 h-12 mx-auto mb-3 opacity-60"></i>
                                    <p class="text-xs font-bold tracking-widest uppercase opacity-60">Select</p>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
                <div class="mt-6 flex justify-center">
                    <button @click="closeModal()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-14 rounded-full text-base tracking-widest uppercase transition">
                        저장 및 뒤로가기
                    </button>
                </div>
            </div>
        </template>

        <!-- 상세 프로필(상태창) 모달 새로 추가 -->
        <template x-if="currentModal==='MY_PROFILE'">
            <div class="panel-box w-full max-w-5xl flex flex-col overflow-hidden shadow-2xl" @click.away="closeModal()" style="height: 75vh;">
                <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/40">
                    <div>
                        <h2 class="text-3xl font-bold serif flex items-center gap-2">
                            <i data-lucide="award" class="text-amber-400 w-7 h-7"></i> 종합 상태창
                        </h2>
                        <p class="text-slate-400 text-sm mt-1">모험가님의 종합 기록과 스탯을 확인합니다.</p>
                    </div>
                    <button @click="closeModal()" class="w-10 h-10 rounded-full bg-slate-800/80 border border-white/20 text-slate-300 flex items-center justify-center hover:bg-red-500 hover:text-white hover:border-red-500 transition-all z-10 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>

                <div class="flex-1 p-6 overflow-y-auto bg-slate-900/50 flex gap-6">
                    <!-- 왼쪽 사이드 막대 (개인 정보) -->
                    <div class="w-1/3 flex flex-col gap-4">
                        <div class="panel-box p-6 flex flex-col items-center bg-slate-800 border-none relative group">
                            <!-- 초상화 변경 버튼 영역 -->
                            <div @click="openModal('PROFILE_EDIT')" class="w-32 h-32 rounded-full border-4 border-amber-500 overflow-hidden bg-black/60 relative cursor-pointer block">
                                <img :src="playerPortrait" alt="avatar" class="w-full h-full object-cover">
                                <div class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                    <i data-lucide="edit-3" class="text-white w-6 h-6 mb-1"></i>
                                    <span class="text-xs font-bold text-white tracking-widest">설정 변경</span>
                                </div>
                            </div>
                            <h3 class="text-2xl font-bold serif mt-4" x-text="playerNickname"></h3>
                            <div class="text-amber-400 text-sm font-bold tracking-widest mt-1">Lv. <span x-text="playerLevel"></span></div>
                            <div class="text-slate-400 text-xs mt-0.5">UID: 800012345</div>
                            <div class="w-full h-px bg-white/10 my-4"></div>
                            <div class="w-full space-y-2">
                                <div class="flex justify-between text-sm">
                                    <span class="text-slate-400">칭호</span>
                                    <span class="text-cyan-300 font-bold">초보 무림인</span>
                                </div>
                                <div class="flex justify-between text-sm">
                                    <span class="text-slate-400">문파</span>
                                    <span class="text-slate-500 font-bold">소속 없음</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 오른쪽: Bento Grid 통계 영역 -->
                    <div class="flex-1 grid grid-cols-2 grid-rows-3 gap-4">
                        <!-- 전투력 -->
                        <div class="panel-box p-6 bg-gradient-to-br from-red-900/40 to-slate-800 border-none flex flex-col justify-center">
                            <p class="text-red-300 text-xs tracking-widest font-bold mb-1 flex items-center gap-1.5"><i data-lucide="swords" class="w-4 h-4"></i> 종합 전투력</p>
                            <div class="text-4xl font-extrabold font-mono text-white tracking-wider" x-text="combatPower.toLocaleString()"></div>
                        </div>

                        <!-- 랭킹 -->
                        <div class="panel-box p-6 bg-gradient-to-br from-amber-900/40 to-slate-800 border-none flex flex-col justify-center">
                            <p class="text-amber-300 text-xs tracking-widest font-bold mb-1 flex items-center gap-1.5"><i data-lucide="trophy" class="w-4 h-4"></i> 서버 랭킹</p>
                            <div class="text-4xl font-extrabold font-mono text-white tracking-wider"><span x-text="serverRank.toLocaleString()"></span><span class="text-lg text-amber-200/60 ml-1">위</span></div>
                        </div>

                        <!-- 진척도 위젯들 (하단 2줄 차지) -->
                        <div class="col-span-2 row-span-2 panel-box p-6 bg-slate-800/80 border-none flex flex-col">
                            <h3 class="text-lg font-bold serif text-white mb-4 flex items-center gap-2">
                                <i data-lucide="map" class="text-blue-400 w-5 h-5"></i> 모험 진척도
                            </h3>
                            <div class="grid grid-cols-3 gap-4 flex-1">
                                <!-- 무한의 탑 -->
                                <div class="bg-black/30 rounded-lg p-4 flex flex-col justify-center items-center text-center border border-white/5 hover:border-blue-500/50 transition">
                                    <i data-lucide="castle" class="w-10 h-10 text-cyan-400 mb-3"></i>
                                    <h4 class="font-bold text-sm text-slate-200">무한의 탑</h4>
                                    <p class="text-2xl font-extrabold text-cyan-300 mt-1 font-mono"><span x-text="towerFloor"></span><span class="text-xs text-slate-500 ml-1">층</span></p>
                                </div>
                                <!-- 던전 -->
                                <div class="bg-black/30 rounded-lg p-4 flex flex-col justify-center items-center text-center border border-white/5 hover:border-purple-500/50 transition">
                                    <i data-lucide="skull" class="w-10 h-10 text-purple-400 mb-3"></i>
                                    <h4 class="font-bold text-sm text-slate-200">기억의 전당</h4>
                                    <p class="text-2xl font-extrabold text-purple-300 mt-1 font-mono"><span x-text="hallStage"></span><span class="text-xs text-slate-500 ml-1">단계</span></p>
                                </div>
                                <!-- 레이드 -->
                                <div class="bg-black/30 rounded-lg p-4 flex flex-col justify-center items-center text-center border border-white/5 hover:border-red-500/50 transition">
                                    <i data-lucide="flame" class="w-10 h-10 text-red-500 mb-3"></i>
                                    <h4 class="font-bold text-sm text-slate-200">주간 레이드</h4>
                                    <p class="text-2xl font-extrabold text-red-400 mt-1 font-mono"><span x-text="raidStage"></span><span class="text-xs text-slate-500 ml-1">단계</span></p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </template>

        <!-- 프로필 사진 및 스탠딩 일러스트 설정창 -->
        <template x-if="currentModal==='PROFILE_EDIT'">
            <div class="panel-box w-full max-w-4xl flex flex-col overflow-hidden shadow-2xl" @click.away="openModal('MY_PROFILE')" style="height: 70vh;">
                <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/40">
                    <div class="flex items-center gap-4">
                        <button @click="openModal('MY_PROFILE')" class="w-10 h-10 rounded-full bg-slate-800/80 border border-white/20 text-slate-300 flex items-center justify-center hover:bg-slate-700 hover:text-white transition-all shadow-lg">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        </button>
                        <div>
                            <h2 class="text-2xl font-bold serif text-white">유저 프로필 이미지 설정</h2>
                            <p class="text-slate-400 text-sm mt-1">로비 캐릭터와 왼쪽 상단 프로필 이미지를 설정합니다.</p>
                        </div>
                    </div>
                    <button @click="closeModal()" class="w-10 h-10 rounded-full bg-slate-800/80 border border-white/20 text-slate-300 flex items-center justify-center hover:bg-red-500 hover:text-white hover:border-red-500 transition-all z-10 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
                
                <div class="flex-1 overflow-y-auto p-6 bg-slate-900/50 scrollbar-hide">
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-5">
                        <template x-for="(char, idx) in myCharacters" :key="idx">
                            <div class="relative group cursor-pointer rounded-xl overflow-hidden border-2 transition-all duration-200 bg-slate-800"
                                 :class="currentCharIndex === idx ? 'border-amber-500 shadow-[0_0_15px_rgba(245,158,11,0.5)]' : 'border-transparent hover:border-white/30'">
                                <div class="aspect-[3/4] w-full relative">
                                    <img :src="char.src" class="w-full h-full object-cover object-top" loading="lazy">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                                    
                                    <!-- Hover Action Overlay -->
                                    <div class="absolute inset-0 bg-black/75 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-center items-center gap-3 p-4">
                                        <button @click.stop="setMainCharacter(idx)" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-sm font-bold shadow transition">
                                            메인 화면 설정
                                        </button>
                                        <button @click.stop="setProfileImage(char.src)" class="w-full py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-bold shadow transition">
                                            프로필로 설정
                                        </button>
                                    </div>
                                    
                                    <!-- Current Indicator -->
                                    <div x-show="currentCharIndex === idx" class="absolute top-2 left-2 bg-amber-500 text-black text-[10px] font-bold px-2 py-0.5 rounded shadow">
                                        메인 로비
                                    </div>
                                    
                                    <div class="absolute bottom-2 left-0 right-0 text-center px-2">
                                        <div class="font-bold serif text-sm text-white truncate drop-shadow-md" x-text="char.name"></div>
                                        <div class="text-[10px] text-amber-300 font-bold tracking-widest mt-0.5" x-text="char.desc"></div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- 객잔 (가챠) 모달 -->
        <template x-if="currentModal==='GACHA'">
            <div class="panel-box w-full max-w-5xl flex flex-col overflow-hidden shadow-2xl" @click.away="!isGachaAnimating && closeModal()" style="height: 80vh;">
                <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/40">
                    <div>
                        <h2 class="text-3xl font-bold serif text-amber-500">천하객잔 (영입)</h2>
                        <p class="text-slate-400 text-sm mt-1">새로운 동료를 맞이합니다.</p>
                    </div>
                    <button @click="closeModal()" x-show="!isGachaAnimating" class="w-10 h-10 rounded-full bg-slate-800/80 border border-white/20 text-slate-300 flex items-center justify-center hover:bg-red-500 hover:text-white hover:border-red-500 transition-all z-10 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
                
                <div class="flex-1 relative flex flex-col items-center justify-center p-6" x-show="gachaResults.length === 0">
                    <div class="text-center mb-10">
                        <i data-lucide="wine" class="text-amber-500 w-24 h-24 mx-auto mb-6 opacity-80"></i>
                        <h3 class="text-2xl font-bold serif text-white mb-2">동료 영입</h3>
                        <p class="text-slate-400">보석을 소모하여 무림의 고수들을 영입할 수 있습니다.</p>
                    </div>
                    <div class="flex gap-6">
                        <button @click="drawGacha(1)" :disabled="isGachaAnimating" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white font-bold py-4 px-12 rounded-xl transition flex flex-col items-center disabled:opacity-50">
                            <span class="text-lg mb-1">1회 영입</span>
                            <span class="text-cyan-400 text-sm flex items-center gap-1"><i data-lucide="gem" class="w-3 h-3"></i> 150</span>
                        </button>
                        <button @click="drawGacha(10)" :disabled="isGachaAnimating" class="bg-amber-600 hover:bg-amber-500 border border-amber-400 text-white font-bold py-4 px-12 rounded-xl transition flex flex-col items-center shadow-[0_0_20px_rgba(245,158,11,0.3)] disabled:opacity-50">
                            <span class="text-lg mb-1">10회 연달아 영입</span>
                            <span class="text-amber-100 text-sm flex items-center gap-1"><i data-lucide="gem" class="w-3 h-3"></i> 1500</span>
                        </button>
                    </div>
                </div>

                <div class="flex-1 p-6 flex flex-col items-center bg-slate-900/80 overflow-y-auto" x-show="gachaResults.length > 0">
                    <h3 class="text-2xl font-bold serif text-amber-400 mb-6 mt-4">영입 결과</h3>
                    <div class="flex flex-wrap justify-center gap-4 max-w-4xl">
                        <template x-for="(res, idx) in gachaResults" :key="idx">
                            <div class="w-32 flex flex-col items-center animate-pulse" :style="`animation: bounce 0.5s ease-out ${idx*0.1}s forwards`">
                                <div class="w-full aspect-[3/4] rounded-lg overflow-hidden border-2 mb-2 relative" :class="res.isNew ? 'border-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.6)]' : 'border-slate-500'">
                                    <img :src="res.imagePath" class="w-full h-full object-cover">
                                    <template x-if="res.isNew">
                                        <div class="absolute top-0 left-0 right-0 bg-red-600/90 text-white text-[10px] font-bold text-center py-0.5">NEW</div>
                                    </template>
                                    <template x-if="!res.isNew && !res.isOverflow">
                                        <div class="absolute bottom-0 left-0 right-0 bg-blue-600/90 text-white text-[10px] font-bold text-center py-0.5" x-text="`돌파 +1 (${res.breakthroughAfter}돌)`"></div>
                                    </template>
                                    <template x-if="res.isOverflow">
                                        <div class="absolute bottom-0 left-0 right-0 bg-slate-700/90 text-white text-[10px] font-bold text-center py-0.5">보석 +15 반환</div>
                                    </template>
                                </div>
                                <div class="text-[11px] font-bold text-white text-center w-full truncate" x-text="res.name"></div>
                            </div>
                        </template>
                    </div>
                    <button @click="gachaResults = []" class="mt-10 bg-slate-700 hover:bg-slate-600 px-8 py-3 rounded-full font-bold transition">확인</button>
                </div>
            </div>
        </template>

        <!-- 보따리 (인벤토리) 모달 -->
        <template x-if="currentModal==='INVENTORY'">
            <div class="panel-box w-full max-w-5xl flex flex-col overflow-hidden shadow-2xl" @click.away="closeModal()" style="height: 80vh;">
                <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/40">
                    <div>
                        <h2 class="text-3xl font-bold serif text-white">보따리 (캐릭터 목록)</h2>
                        <p class="text-slate-400 text-sm mt-1">획득한 동료들의 세부 정보를 확인합니다.</p>
                    </div>
                    <button @click="closeModal()" class="w-10 h-10 rounded-full bg-slate-800/80 border border-white/20 text-slate-300 flex items-center justify-center hover:bg-red-500 hover:text-white hover:border-red-500 transition-all z-10 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
                
                <div class="flex-1 p-6 overflow-y-auto bg-slate-900/50 scrollbar-hide">
                    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
                        <template x-for="(char, idx) in myCharacters" :key="idx">
                            <div class="rounded-xl overflow-hidden border bg-slate-800 transition cursor-pointer flex flex-col group relative"
                                 :class="char.rarityColor">
                                <div class="aspect-square w-full relative">
                                    <img :src="char.src" class="w-full h-full object-cover object-top">
                                    <div class="absolute top-2 left-2 px-1.5 py-0.5 rounded text-[10px] font-bold text-white bg-black/60" x-text="char.role"></div>
                                    
                                    <!-- 등급 배지 -->
                                    <div class="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/60 border border-white/20 flex items-center justify-center">
                                        <span class="text-xs font-black italic" x-text="char.rarity"></span>
                                    </div>
                                </div>
                                <div class="p-3 text-center flex-1 flex flex-col justify-between">
                                    <div>
                                        <div class="text-[10px] opacity-70 font-bold tracking-widest mb-0.5" x-text="char.desc"></div>
                                        <div class="font-bold serif text-base text-white truncate" x-text="char.name"></div>
                                    </div>
                                    <div class="text-slate-400 text-[10px] font-mono mt-2 bg-black/30 rounded py-0.5" x-text="'Lv. ' + char.level"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- 던전 모달 -->
        <template x-if="currentModal==='DUNGEON'">
            <div class="panel-box w-full max-w-4xl flex flex-col overflow-hidden shadow-2xl" @click.away="closeModal()" style="height: 70vh;">
                <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/40">
                    <div>
                        <h2 class="text-3xl font-bold serif text-purple-400">일일 수련: 기억의 전당</h2>
                        <p class="text-slate-400 text-sm mt-1">강력한 환영을 처치하고 성장 재화를 획득합니다.</p>
                    </div>
                    <button @click="closeModal()" class="w-10 h-10 rounded-full bg-slate-800/80 border border-white/20 text-slate-300 flex items-center justify-center hover:bg-red-500 hover:text-white hover:border-red-500 transition-all z-10 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
                <div class="flex-1 p-8 flex flex-col items-center justify-center bg-slate-900/60">
                    <div class="grid grid-cols-3 gap-6 w-full max-w-3xl">
                        <div class="panel p-6 text-center hover:border-purple-500 cursor-pointer transition">
                            <i data-lucide="sword" class="w-12 h-12 text-red-400 mx-auto mb-3"></i>
                            <h3 class="font-bold mb-1">무공의 시련</h3>
                            <p class="text-xs text-slate-400">경험치 두루마리</p>
                        </div>
                        <div class="panel p-6 text-center hover:border-purple-500 cursor-pointer transition">
                            <i data-lucide="shield" class="w-12 h-12 text-blue-400 mx-auto mb-3"></i>
                            <h3 class="font-bold mb-1">방어의 시련</h3>
                            <p class="text-xs text-slate-400">강화석</p>
                        </div>
                        <div class="panel p-6 text-center hover:border-purple-500 cursor-pointer transition">
                            <i data-lucide="coins" class="w-12 h-12 text-yellow-400 mx-auto mb-3"></i>
                            <h3 class="font-bold mb-1">탐욕의 시련</h3>
                            <p class="text-xs text-slate-400">대량의 금화</p>
                        </div>
                    </div>
                    <button @click="enterDungeon()" class="mt-10 bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 px-16 rounded-full text-lg tracking-widest uppercase transition shadow-[0_0_15px_rgba(147,51,234,0.4)]">
                        수련 시작 (스태미나 -10)
                    </button>
                </div>
            </div>
        </template>

        <!-- 문파 모달 -->
        <template x-if="currentModal==='GUILD'">
            <div class="panel-box w-full max-w-4xl flex flex-col overflow-hidden shadow-2xl" @click.away="closeModal()" style="height: 70vh;">
                <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/40">
                    <div>
                        <h2 class="text-3xl font-bold serif text-green-400">문파 (길드)</h2>
                        <p class="text-slate-400 text-sm mt-1">동료들과 힘을 합쳐 무림을 제패하세요.</p>
                    </div>
                    <button @click="closeModal()" class="w-10 h-10 rounded-full bg-slate-800/80 border border-white/20 text-slate-300 flex items-center justify-center hover:bg-red-500 hover:text-white hover:border-red-500 transition-all z-10 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
                <div class="flex-1 flex items-center justify-center bg-slate-900/60 p-8">
                    <div class="text-center">
                        <i data-lucide="tent" class="w-20 h-20 text-green-500 mx-auto mb-6 opacity-80"></i>
                        <h3 class="text-2xl font-bold mb-4">소속된 문파가 없습니다</h3>
                        <div class="flex justify-center gap-4">
                            <button class="bg-green-600 hover:bg-green-500 py-3 px-8 rounded-lg font-bold transition">문파 창설</button>
                            <button class="bg-slate-700 hover:bg-slate-600 py-3 px-8 rounded-lg font-bold transition border border-slate-500">가입 신청</button>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- 기타 모달 -->
        <template x-if="currentModal && !['PARTY', 'MY_PROFILE', 'PROFILE_EDIT', 'GACHA', 'INVENTORY', 'DUNGEON', 'GUILD', 'TOWER', 'RAID'].includes(currentModal)">
            <div @click.away="closeModal()" class="panel-box max-w-md w-full overflow-hidden shadow-xl" style="height:45vh">
                <div class="p-4 border-b border-white/5 flex justify-between items-center bg-black/30">
                    <h3 class="text-lg font-bold serif text-amber-500" x-text="modalTitle"></h3>
                    <button @click="closeModal()" class="w-8 h-8 rounded-full bg-slate-800/80 border border-white/20 text-slate-300 flex items-center justify-center hover:bg-red-500 hover:text-white hover:border-red-500 transition-all z-10 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
                <div class="flex-1 p-6 flex flex-col items-center justify-center h-full">
                    <i data-lucide="ghost" class="text-slate-600 w-16 h-16 mb-4"></i>
                    <h4 class="font-bold mb-1">공사 중</h4>
                    <p class="text-slate-500 text-sm text-center" x-text="'[ '+modalTitle+' ] 구현 예정'"></p>
                </div>
            </div>
        </template>
    </div>
</div>

<script src="/js/lobby.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>lucide.createIcons())</script>
</body>
</html>
