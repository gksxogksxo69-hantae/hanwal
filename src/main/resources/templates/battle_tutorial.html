<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전투 - 턴제 엔진</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #020617; font-family: 'Pretendard', sans-serif; }
        .gowun-batang { font-family: 'Gowun Batang', serif; }

        /* 다대다 파티 메인 컨테이너 */
        .battle-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            /* height: 100dvh; 모바일 툴바 제외 영역 확보 */
            height: 100dvh; 
        }

        /* [Zone 1] 최상단 타임라인 (가로형) */
        .top-timeline {
            height: 80px;
            background: linear-gradient(180deg, rgba(15,23,42,0.95), rgba(15,23,42,0.5));
            border-bottom: 1px solid rgba(51,65,85,0.5);
            display: flex;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0 1rem;
            gap: 1rem;
            scrollbar-width: none; /* Firefox */
        }
        .top-timeline::-webkit-scrollbar { display: none; }

        /* 타임라인 초상화 액티브 스타일 */
        .timeline-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            filter: grayscale(0.5) opacity(0.7);
        }
        .timeline-item.active {
            transform: scale(1.15) translateY(-5px);
            filter: grayscale(0) opacity(1);
            border-color: #38bdf8 !important;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
            z-index: 10;
        }

        /* [Zone 2] 전투 필드 (중앙) */
        .battle-field {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at center 30%, #1e293b 0%, #020617 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 전투 필드 - 적군 영역 (상단) */
        .enemy-zone {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 2rem;
            gap: 2rem;
        }
        
        /* 전투 필드 - 아군 파티 4인 영역 (하단) */
        .party-zone {
            height: 35vh;
            border-top: 1px dashed rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-evenly; /* 4명을 균등 배치 */
            align-items: flex-end;
            padding-bottom: 1rem;
            background: linear-gradient(0deg, rgba(15,23,42,0.8), transparent);
        }

        /* 아군 스탠딩 렌더 박스 */
        .party-slot {
            width: 22%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            transition: all 0.3s;
        }
        .party-slot.active-turn {
            transform: translateY(-15px);
        }
        .party-slot.active-turn img {
            filter: brightness(1.2) drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
        }

        /* 전투 로그 창 (절대 위치로 우측 상단 플로팅) */
        .floating-log {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 280px;
            max-height: 150px;
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(51,65,85,0.5);
            border-radius: 0.5rem;
            overflow-y: auto;
            padding: 0.5rem;
            pointer-events: none; /* 클릭 방해 안 함 */
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* [Zone 3] 다이내믹 커맨드 패널 (하단) */
        .command-panel {
            min-height: 140px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            padding: 1rem;
            gap: 1.5rem;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            z-index: 20;
        }
        @media (max-width: 768px) {
            .command-panel { flex-direction: column; padding: 0.5rem; gap: 0.5rem; }
            .party-zone { height: 25vh; }
        }

        /* 이펙트 CSS 보존 */
        .hit-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-4px, 0, 0); }
            20%, 80% { transform: translate3d(6px, 0, 0); filter: brightness(2) drop-shadow(0 0 10px red); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }
        .slash-effect {
            position: absolute; top: 50%; left: 50%; width: 150%; height: 4px;
            background: linear-gradient(90deg, transparent, #fbbf24, #fff, #fbbf24, transparent);
            box-shadow: 0 0 20px #fbbf24, 0 0 40px #f59e0b;
            transform: translate(-50%, -50%) rotate(-45deg) scaleX(0);
            animation: slash 0.6s ease-in-out forwards; z-index: 50; pointer-events: none;
        }
        @keyframes slash {
            0% { transform: translate(-50%, -50%) rotate(-45deg) scaleX(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) rotate(-45deg) scaleX(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) rotate(-45deg) scaleX(1.5); opacity: 0; height: 2px;}
        }
        .ice-explosion {
            position: absolute; top: 50%; left: 50%; width: 200px; height: 200px;
            background: radial-gradient(circle, #bae6fd 10%, #0ea5e9 50%, transparent 80%); border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: freezeBurst 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 50; pointer-events: none; mix-blend-mode: screen;
        }
        @keyframes freezeBurst {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            70% { transform: translate(-50%, -50%) scale(2); opacity: 0.8; backdrop-filter: grayscale(1); }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }
        .dmg-text {
            position: absolute; font-size: 3rem; font-weight: 800; font-family: 'Gowun Batang', serif;
            color: #ef4444; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 20px #ef4444;
            animation: floatUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; pointer-events: none; z-index: 60;
        }
        .dmg-text.critical { font-size: 5rem; color: #fbbf24; text-shadow: 2px 2px 0 #000, 0 0 30px #f59e0b; }
        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
            15% { opacity: 1; transform: translate(-50%, -30px) scale(1.2); }
            30% { transform: translate(-50%, -40px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -80px) scale(1); }
        }
        
        .pulse-ult { animation: pulse-border 1.5s infinite; }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .white-out {
            position: absolute; inset: 0; background: white; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 2s ease-in-out;
        }
        .white-out.active { opacity: 1; pointer-events: auto; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body x-data="battleApp()">

    <div class="battle-container">
        
        <!-- [Story Mode Overlay] 비주얼 노벨 연출 -->
        <div class="absolute inset-0 z-[100] bg-black/90 backdrop-blur-md flex flex-col justify-end pb-12 transition-opacity duration-1000"
             x-show="gameState === 'STORY'"
             x-transition:leave="opacity-100"
             x-transition:leave-end="opacity-0"
             @click="nextStory">
            
            <div class="w-full max-w-4xl mx-auto px-6">
                <div class="bg-slate-900/80 border border-slate-700/50 rounded-lg p-6 md:p-8 shadow-2xl relative overflow-hidden backdrop-blur-sm">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-amber-500 to-transparent opacity-50"></div>
                    
                    <div class="min-h-[100px] flex items-center">
                        <p class="text-xl md:text-3xl gowun-batang text-slate-200 leading-relaxed tracking-wide" x-text="currentStoryLine"></p>
                        <span class="animate-pulse ml-2 w-2 h-6 bg-slate-400 inline-block" x-show="isTyping"></span>
                    </div>
                    
                    <div class="absolute bottom-4 right-6 text-sm text-slate-500 animate-pulse" x-show="!isTyping">
                        클릭하여 진행 
                    </div>
                </div>
            </div>
        </div>

        <!-- [Zone 1] 최상단 타임라인 (Turn Queue) -->
        <div class="top-timeline">
            <!-- 턴을 순서대로 나란히 정렬 -->
            <template x-for="(entity, idx) in turnQueue" :key="idx + '-' + entity.id">
                <div class="timeline-item w-12 h-12 shrink-0 rounded-full bg-slate-800 border-2 border-slate-600 relative overflow-hidden"
                     :class="{ 'active': entity.isActive }">
                    <img :src="entity.portrait" class="w-full h-full object-cover">
                    <!-- 남은 체력 게이지 아주 얇게 -->
                    <div class="absolute bottom-0 left-0 h-1 bg-red-500" :style="`width: ${(entity.hp/entity.maxHp)*100}%`"></div>
                </div>
            </template>
        </div>

        <!-- [Zone 2] 전투 필드 (Battle Field) -->
        <div class="battle-field">
            
            <!-- 시스템 로깅 (우측 상단 플로팅) -->
            <div id="log-container" class="floating-log no-scrollbar">
                <template x-for="(log, idx) in logs" :key="idx">
                    <div class="text-[13px] font-myeongjo animate-[fadeIn_0.3s_ease-out]"
                         :class="{
                             'text-emerald-300': log.type === 'player',
                             'text-red-300': log.type === 'enemy',
                             'text-amber-300': log.type === 'skill',
                             'text-slate-400': log.type === 'system'
                         }">
                        <span x-text="log.message"></span>
                    </div>
                </template>
            </div>

            <!-- 적군 영역 -->
            <div class="enemy-zone relative">
                <template x-for="(enemy, idx) in enemies" :key="enemy.id">
                    <div :id="`enemy-${enemy.id}`" class="relative flex flex-col items-center transition-transform duration-300" :class="{ 'opacity-0 scale-95': enemy.isDead }">
                        <!-- 적 이미지 (튜토리얼은 1마리 보스 느낌) -->
                        <div class="relative group cursor-pointer" @click="selectTarget(enemy)">
                            <!-- 선택 이펙트 -->
                            <div class="absolute -inset-2 border-2 border-dashed border-red-500 rounded-full animate-spin-slow opacity-0 group-hover:opacity-100" x-show="selectedTarget === enemy.id"></div>
                            
                            <div class="w-32 h-32 md:w-48 md:h-48 bg-red-900/30 border border-red-800/50 flex items-center justify-center rounded shadow-[0_0_40px_rgba(153,27,27,0.4)] overflow-hidden">
                                <img :src="enemy.portrait" class="w-[150%] hue-rotate-180 brightness-75 object-cover object-top">
                            </div>
                        </div>

                        <!-- 적 체력바 -->
                        <div class="mt-4 w-32 md:w-48 h-2.5 bg-slate-800 rounded-full border border-slate-600 overflow-hidden relative shadow">
                            <div class="bg-red-600 h-full transition-all duration-300 ease-out" :style="`width: ${(enemy.hp / enemy.maxHp) * 100}%`"></div>
                        </div>
                        <div class="text-xs text-red-300 mt-1 font-bold tracking-widest" x-text="enemy.name"></div>
                        
                        <div :id="`damage-layer-${enemy.id}`" class="absolute inset-0 z-50"></div>
                        <div :id="`effect-layer-${enemy.id}`" class="absolute inset-0 pointer-events-none"></div>
                    </div>
                </template>
            </div>

            <!-- 아군 4인 파티 존 -->
            <div class="party-zone">
                <template x-for="(ally, idx) in party" :key="Math.random()">
                    <!-- 슬롯이 비었으면 빈칸 렌더 -->
                    <template x-if="ally === null">
                        <div class="party-slot opacity-30">
                            <!-- 빈 자리 표시 -->
                        </div>
                    </template>
                    
                    <template x-if="ally !== null">
                        <div class="party-slot" :class="{'active-turn': ally.isActive}">
                            <!-- 내 턴일때 빛나는 바닥 장판 -->
                            <div class="absolute bottom-0 w-24 h-4 bg-sky-500/20 rounded-[100%] blur-sm transition-opacity duration-300" 
                                 :class="ally.isActive ? 'opacity-100' : 'opacity-0'"></div>
                            
                            <!-- 스탠딩 일러스트 -->
                            <div class="relative w-24 h-32 md:w-32 md:h-40 flex items-end justify-center mb-4">
                                <img :src="ally.standing" class="max-w-[150%] max-h-[150%] object-contain" :class="{'grayscale brightness-50': ally.isDead}">
                            </div>

                            <!-- 체력바/마나바 컨테이너 -->
                            <div class="w-full max-w-[100px] flex flex-col gap-1 items-center z-10 px-2" :class="{'opacity-50': ally.isDead}">
                                <span class="text-[10px] text-white font-bold tracking-wide" x-text="ally.name"></span>
                                <!-- HP -->
                                <div class="w-full h-1.5 bg-slate-800 border border-slate-900 rounded-full overflow-hidden">
                                    <div class="bg-emerald-500 h-full transition-all" :style="`width: ${(ally.hp/ally.maxHp)*100}%`"></div>
                                </div>
                                <!-- Energy -->
                                <div class="w-full h-1 bg-slate-800 border border-slate-900 rounded-full overflow-hidden mb-[1px]">
                                    <div class="bg-yellow-500 h-full transition-all" :style="`width: ${(ally.energy/ally.maxEnergy)*100}%`"></div>
                                </div>
                                <!-- Spirit -->
                                <div class="w-full h-1 bg-slate-800 border border-slate-900 rounded-full overflow-hidden">
                                    <div class="bg-fuchsia-500 h-full transition-all" :style="`width: ${(ally.spirit/ally.maxSpirit)*100}%`"></div>
                                </div>
                            </div>
                        </div>
                    </template>
                </template>
            </div>

        </div>

        <!-- [Zone 3] 다이내믹 커맨드 패널 (하단) -->
        <div class="command-panel relative">
            
            <!-- 블로커 (내 턴이 아닐 때) -->
            <div class="absolute inset-0 backdrop-blur-[2px] bg-black/40 z-30 flex items-center justify-center transition-opacity duration-300" 
                 x-show="!isPlayerTurn || gameState !== 'WAITING_INPUT'">
            </div>

            <!-- 현재 턴인 아군 캐릭터 상세 프로필 -->
            <div class="flex-none w-full md:w-64 border-b md:border-b-0 md:border-r border-slate-600/50 pb-2 md:pb-0 md:pr-4 flex items-center md:items-start gap-4">
                <template x-if="currentActor !== null && currentActor.type === 'PARTY'">
                    <div class="flex gap-4 w-full h-full">
                        <div class="w-16 h-16 md:w-24 md:h-24 rounded-lg bg-slate-800 border-2 border-slate-500 overflow-hidden shrink-0 shadow-lg relative">
                            <img :src="currentActor.portrait" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-grow flex flex-col justify-center gap-1.5">
                            <div class="font-bold text-white text-lg md:text-xl gowun-batang tracking-wider" x-text="currentActor.name"></div>
                            <div>
                                <div class="text-[10px] text-emerald-400 mb-0.5">HP <span x-text="currentActor.hp"></span></div>
                                <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                                    <div class="bg-emerald-500 h-full transition-all" :style="`width: ${(currentActor.hp / currentActor.maxHp) * 100}%`"></div>
                                </div>
                            </div>
                            <div class="flex gap-2 w-full">
                                <div class="flex-1">
                                    <div class="text-[10px] text-yellow-400 mb-0.5">기력 <span x-text="currentActor.energy"></span></div>
                                    <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                                        <div class="bg-yellow-500 h-full transition-all" :style="`width: ${(currentActor.energy / currentActor.maxEnergy) * 100}%`"></div>
                                    </div>
                                </div>
                                <div class="flex-1">
                                    <div class="text-[10px] text-fuchsia-400 mb-0.5">투기 <span x-text="currentActor.spirit"></span></div>
                                    <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                                        <div class="bg-fuchsia-500 h-full transition-all" :style="`width: ${(currentActor.spirit / currentActor.maxSpirit) * 100}%`"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
                <template x-if="currentActor == null || currentActor.type === 'ENEMY'">
                    <div class="w-full flex items-center justify-center text-slate-500 animate-pulse text-sm">적의 행동 대기 중...</div>
                </template>
            </div>

            <!-- 현재 턴인 캐릭터의 동적 스킬 덱 (고정 4개 슬롯) -->
            <div class="flex-grow grid grid-cols-4 gap-2 md:gap-4 items-center px-0 md:px-4">
                <template x-if="currentActor !== null && currentActor.type === 'PARTY'">
                    <div class="contents">
                        <!-- 스킬 리스트 순회 (무조건 4칸, JS에서 잠긴 스킬 포함하여 세팅해줌) -->
                        <template x-for="(skill, idx) in currentActor.skills" :key="idx">
                            <div class="h-16 md:h-20 relative group">
                                
                                <!-- 활성 스킬 -->
                                <template x-if="!skill.isLock">
                                    <button @click="executeAction(idx)" 
                                            :class="skill.isUltimate ? 'bg-gradient-to-br from-amber-700 to-amber-900 border-amber-500 shadow-[0_0_15px_rgba(245,158,11,0.4)] pulse-ult hover:brightness-125 border-2' : 'bg-slate-800/80 hover:bg-slate-700 hover:scale-105 border border-slate-600'"
                                            class="w-full h-full rounded-xl md:rounded-2xl transition text-slate-200 font-bold flex flex-col items-center justify-center gap-1">
                                        
                                        <!-- 아이콘 렌더링 (SVG 하드코딩으로 Lucide 아이콘 리페인팅 이슈 회피) -->
                                        <!-- 궁극기 -->
                                        <template x-if="skill.isUltimate">
                                            <svg class="w-5 h-5 md:w-6 md:h-6 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
                                        </template>
                                        <!-- 버프 -->
                                        <template x-if="!skill.isUltimate && skill.type === 'BUFF'">
                                            <svg class="w-5 h-5 md:w-6 md:h-6 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                                        </template>
                                        <!-- 일반 공격기 -->
                                        <template x-if="!skill.isUltimate && skill.type === 'DAMAGE'">
                                            <svg class="w-5 h-5 md:w-6 md:h-6 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14.5 17.5L3 6V3h3l11.5 11.5m-5.5 0L17 19l4-4-2-2"></path></svg>
                                        </template>

                                        <span class="text-[10px] md:text-sm" :class="{'gowun-batang tracking-widest text-amber-200': skill.isUltimate}" x-text="skill.name"></span>
                                    </button>
                                </template>
                                
                                <!-- 잠긴 스킬 -->
                                <template x-if="skill.isLock">
                                    <button disabled class="w-full h-full bg-slate-900 border border-slate-800 rounded-xl md:rounded-2xl flex flex-col items-center justify-center gap-1 opacity-50 cursor-not-allowed">
                                        <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0110 0v4"></path></svg>
                                    </button>
                                </template>

                                <!-- 툴팁 (호버 시 스킬 상세 설명) -->
                                <div x-show="!skill.isLock" class="absolute bottom-[105%] left-1/2 -translate-x-1/2 mb-2 w-48 bg-slate-900 border border-slate-600 p-3 text-xs rounded-lg opacity-0 group-hover:opacity-100 pointer-events-none transition z-50 text-slate-300 shadow-xl overflow-hidden">
                                    <div class="text-slate-300 font-bold mb-1 flex justify-between">
                                        <span class="flex gap-2 text-[10px]">
                                            <span x-show="skill.energyCost > 0" class="text-yellow-400">기력-<span x-text="skill.energyCost"></span></span>
                                            <span x-show="skill.energyCost < 0" class="text-yellow-400">기력+<span x-text="Math.abs(skill.energyCost)"></span></span>
                                            <span x-show="skill.spiritCost > 0" class="text-fuchsia-400">투기-<span x-text="skill.spiritCost"></span></span>
                                            <span x-show="skill.spiritCost < 0" class="text-fuchsia-400">투기+<span x-text="Math.abs(skill.spiritCost)"></span></span>
                                        </span>
                                        <span class="text-emerald-400 shrink-0" x-text="skill.type === 'BUFF' ? '버프' : '공격기'"></span>
                                    </div>
                                    <div class="w-full h-px bg-slate-700 my-1"></div>
                                    <div class="text-xs leading-relaxed" x-text="skill.description"></div>
                                </div>

                            </div>
                        </template>
                    </div>
                </template>
            </div>

        </div>
    </div>

    <!-- 승리 -->
    <div id="whiteOut" class="white-out flex flex-col items-center justify-center gap-4">
        <h1 class="gowun-batang text-5xl text-amber-500 font-bold">전투 승리</h1>
        <p class="text-slate-600 font-myeongjo">무림맹 본산으로 이동합니다...</p>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/js/battle_tutorial.js"></script>
    <script> lucide.createIcons(); </script>

</body>
</html>
