<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 배경 원형 -->
  <circle cx="50" cy="50" r="45" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  
  <!-- 내부 곡선 (초승달 느낌) -->
  <path d="M 70,30 A 25,25 0 1,1 40,75 A 35,35 0 0,0 70,30 Z" fill="rgba(245, 158, 11, 0.2)" />
  
  <!-- 텍스트 "月" -->
  <text x="50" y="68" font-family="'Batang', serif" font-size="44" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">月</text>
</svg>
