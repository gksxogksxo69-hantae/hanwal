<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한월(韓月) - 로비</title>
    <link rel="icon" th:href="@{/images/favicon.svg}" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { box-sizing: border-box }
        body {
            margin: 0; overflow: hidden; background: #010409;
            font-family: 'Pretendard', sans-serif; color: #fff
        }
        .serif { font-family: 'Gowun Batang', serif }
        .bg-layer { position: absolute; inset: 0; z-index: 0 }
        .bg-layer img { width: 100%; height: 100%; object-fit: cover; opacity: .4 }
        
        .glass-panel { background: rgba(10, 15, 28, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; }
        .glass-panel-circle { background: rgba(10, 15, 28, 0.6); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 9999px; }
        .glass-button { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.12); transition: all 0.3s; cursor: pointer; }
        .glass-button:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }

        .jade-bar { background: linear-gradient(90deg, #10b981, #059669); }
        
        .char-wrap {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            height: 94vh; z-index: 2; pointer-events: none;
            -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent 95%);
            mask-image: linear-gradient(to bottom, #000 60%, transparent 95%);
        }
        .char-wrap img { height: 100%; object-fit: contain; }

        .char-switcher {
            position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between;
            padding: 0 8%; z-index: 10; pointer-events: none;
        }
        .switcher-btn {
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; pointer-events: auto;
        }

        .gate-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 320px; }
        .gate-card {
            height: 70px; padding: 10px; display: flex; flex-direction: column; justify-content: center;
            position: relative; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gate-main { grid-column: span 2; height: 90px; background: linear-gradient(135deg, #b45309, #78350f); border-color: #f59e0b; }
        
        @keyframes pulse-cp { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .animate-cp { animation: pulse-cp 2s infinite ease-in-out; }

        /* 커스텀 스크롤바 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.25); border-radius: 9999px; transition: background 0.3s; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(245, 158, 11, 0.5); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 가챠 카드 3D 플립 */
        .gacha-card-container { perspective: 900px; cursor: pointer; }
        .gacha-card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .gacha-card-inner.flipped { transform: rotateY(180deg); }
        .gacha-card-front, .gacha-card-back {
            position: absolute; inset: 0; backface-visibility: hidden;
            border-radius: 12px; overflow: hidden;
        }
        .gacha-card-back { transform: rotateY(180deg); }

        /* 등급별 카드 테두리 & 배경 */
        .rarity-S { border: 2px solid #f59e0b; box-shadow: 0 0 20px rgba(245,158,11,0.4), inset 0 0 15px rgba(245,158,11,0.1); }
        .rarity-A { border: 2px solid #ef4444; box-shadow: 0 0 15px rgba(239,68,68,0.3), inset 0 0 10px rgba(239,68,68,0.08); }
        .rarity-B, .rarity-C { border: 2px solid #64748b; box-shadow: 0 0 8px rgba(100,116,139,0.2); }

        /* 등급 뱃지 */
        .rarity-badge {
            position: absolute; top: 4px; left: 4px; z-index: 10;
            width: 22px; height: 22px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 900; letter-spacing: -0.5px;
        }
        .rarity-badge-S { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .rarity-badge-A { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
        .rarity-badge-B { background: #475569; color: #94a3b8; }
        .rarity-badge-C { background: #334155; color: #64748b; }

        /* 카드 뒷면 패턴 */
        .card-back-pattern {
            background: linear-gradient(135deg, #1e293b 25%, #0f172a 25%, #0f172a 50%, #1e293b 50%, #1e293b 75%, #0f172a 75%);
            background-size: 20px 20px;
        }

        /* NEW 뱃지 */
        @keyframes badge-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .new-badge { animation: badge-glow 1.5s ease-in-out infinite; }
    </style>
    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('lobbyApp', () => ({
            playerGender: 'MALE', playerNickname: '모험가', level: 1, exp: 0, requiredExp: 100,
            gold: 0, gems: 0, stamina: 0, maxStamina: 200,
            claimedLevelRewards: "", claimedActRewards: "", storyChapter: 0, currentModal: null, modalTitle: '', isLoading: true, customPortrait: null,
            gachaResults: [], isGachaAnimating: false, myCharacters: [], currentCharIndex: 0, currentParty: [null, null, null, null],
            combatPower: 0, partyCombatPower: 0, serverRank: '--', towerFloor: 1, hallStage: 1, raidStage: 1, maxClearedStageId: 0,
            currentQuest: { id: 0, title: '로딩 중...', goalDesc: '데이터 동기화 중...', status: 'IN_PROGRESS' },
            stages: [], currentChapter: 1, selectedPartySlot: 0,
            ranking: [], guideStep: 0, guideActive: false, guideMonologueText: '',
            towerEnemies: [], dailyDungeons: [], inventoryFilter: 'ALL', raidWeeklyRemaining: 3,
            alertState: { show: false, message: '', type: 'info' },
            mails: [], mailUnreadCount: 0,
            
            showAlert(message, type = 'info') {
                this.alertState = { show: true, message, type };
                this.$nextTick(() => lucide.createIcons());
            },
            closeAlert() {
                this.alertState.show = false;
            },
            
            advanceGuideMonologue() {
                console.log("Guide advanced");
                this.guideActive = false;
            },

            async init() {
                await this.loadPlayerInfo();
                await this.loadMyCharacters();
                await this.fetchQuestInfo();
                await this.fetchMailList();
                this.isLoading = false;
                this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
            },

            async fetchMailList() {
                try {
                    const res = await fetch('/api/mail/list');
                    const data = await res.json();
                    if (data.success) {
                        this.mails = data.mails;
                        this.mailUnreadCount = data.unreadCount || 0;
                    }
                } catch (e) { console.warn('우편함 로딩 실패:', e); }
            },

            async claimMail(mailId) {
                try {
                    const res = await fetch(`/api/mail/claim/${mailId}`, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        await this.fetchMailList();
                        await this.loadPlayerInfo();
                        this.showAlert('보상을 수령했습니다!', 'success');
                    } else {
                        this.showAlert(data.error || '수령 실패', 'error');
                    }
                } catch (e) { console.error(e); }
            },

            async claimAllMails() {
                try {
                    const res = await fetch('/api/mail/claim-all', { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        await this.fetchMailList();
                        await this.loadPlayerInfo();
                        this.showAlert(data.message || '전체 수령 완료!', 'success');
                    } else {
                        this.showAlert(data.error || '수령 실패', 'error');
                    }
                } catch (e) { console.error(e); }
            },

            async loadPlayerInfo() {
                try {
                    const res = await fetch('/api/map/player-info');
                    const data = await res.json();
                    if (data.success) {
                        this.playerGender = data.gender;
                        this.playerNickname = data.nickname;
                        this.level = data.level || 1;
                        this.exp = data.exp || 0;
                        this.requiredExp = data.requiredExp || 100;
                        this.gold = data.gold || 0;
                        this.gems = data.gems || 0;
                        this.combatPower = data.totalPower || 0;
                        this.partyCombatPower = data.partyPower || 0;
                        this.serverRank = data.serverRank || '--';
                        this.towerFloor = data.towerFloor;
                        this.hallStage = data.hallStage;
                        this.raidStage = data.raidStage;
                        this.maxClearedStageId = data.maxClearedStageId;
                        this.claimedActRewards = data.claimedActRewards || "";
                        this.claimedLevelRewards = data.claimedLevelRewards || "";
                        this.storyChapter = data.storyChapter || 0;
                        this.stamina = data.stamina || 0;
                        this.maxStamina = data.maxStamina || 200;
                        if (data.profileImagePath) this.customPortrait = data.profileImagePath;
                        if (data.mainCharacterId) {
                            this.serverMainCharacterId = data.mainCharacterId;
                        }
                    }
                } catch (e) { console.warn(e); }
            },

            async fetchRanking() {
                try {
                    const res = await fetch('/api/map/ranking');
                    const data = await res.json();
                    if (data.success) this.ranking = data.ranking;
                } catch (e) { console.error(e); }
            },

            async fetchQuestInfo() {
                try {
                    const res = await fetch('/api/quest/current');
                    if (res.ok) this.currentQuest = await res.json();
                } catch (e) { console.error(e); }
            },

            async loadMyCharacters() {
                try {
                    const res = await fetch('/api/lobby/my-characters');
                    const data = await res.json();
                    if (data.success && data.characters) {
                        this.stamina = data.stamina || this.stamina;
                        this.maxStamina = data.maxStamina || 200;
                        this.myCharacters = data.characters.map(c => ({
                            id: c.id, name: c.name, title: c.title || '기록되지 않은 자', src: c.imagePath, rarity: c.rarity, role: c.role, level: c.level,
                            hp: c.hp || 0, atk: c.atk || 0, def: c.def || 0, spd: c.spd || 0, power: c.power || 0,
                            exp: c.exp || 0, requiredExp: c.requiredExp || 100,
                            faction: c.faction || '-', gender: c.gender || '-', age: c.age || '-', realm: c.realm || '-',
                            alignment: c.alignment || '-', relationships: c.relationships || '-', lore: c.lore || '아직 알려진 기록이 없습니다.'
                        }));
                        if (data.party) {
                             const saved = data.party;
                             for (let i=0; i<4; i++) {
                                 if (saved[i]) this.currentParty[i] = this.myCharacters.find(ch => ch.id === saved[i]) || null;
                             }
                        }
                        if (this.serverMainCharacterId) {
                            const idx = this.myCharacters.findIndex(c => c.id === this.serverMainCharacterId);
                            if (idx !== -1) this.currentCharIndex = idx;
                        }
                    }
                } catch (e) { console.warn(e); }
            },

            get playerPortrait() { return this.customPortrait || (this.playerGender === 'FEMALE' ? '/images/남궁설화.jpg' : '/images/남궁천.png'); },
            get currentLobbyCharacter() { return this.myCharacters.length > 0 ? this.myCharacters[this.currentCharIndex % this.myCharacters.length] : { src: this.playerGender === 'FEMALE' ? '/images/남궁설화.jpg' : '/images/남궁천.png' }; },
            
            selectedCharForDetail: null,
            
            openCharDetail(char) {
                this.selectedCharForDetail = char;
                this.openModal('CHAR_DETAIL');
            },
            
            async selectMainIllustration(charId) {
                try {
                    const res = await fetch('/api/lobby/main-character', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ characterId: charId })
                    });
                    if (res.ok) {
                        this.showAlert("대표 일러스트가 변경되었습니다.", "success");
                        this.serverMainCharacterId = charId;
                        const idx = this.myCharacters.findIndex(c => c.id === charId);
                        if (idx !== -1) this.currentCharIndex = idx;
                        this.closeModal();
                    }
                } catch(e) { console.error(e); }
            },

            async selectPortrait(src) {
                try {
                    const res = await fetch('/api/lobby/profile-image', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ imagePath: src })
                    });
                    if (res.ok) {
                        this.showAlert("초상화가 변경되었습니다.", "success");
                        this.customPortrait = src;
                        this.closeModal();
                    }
                } catch(e) { console.error(e); }
            },

            openModal(type) {
                if (type === 'RANKING') this.fetchRanking();
                if (type === 'TOWER') this.towerEnemies = this.generateTowerEnemies(this.towerFloor);
                if (type === 'DAILY_HALL') this.dailyDungeons = this.getDailyDungeons();
                if (type === 'MAIL') this.fetchMailList();
                this.currentModal = type;
                this.$nextTick(() => lucide.createIcons());
            },
            closeModal() { this.currentModal = null; },
            handleQuestClick() {
                if (this.currentQuest.status === 'COMPLETED') this.openModal('QUEST_REWARD');
                else this.startMission();
            },

            startMission() {
                const hasParty = this.currentParty.some(char => char !== null);
                if (!hasParty) {
                    this.showAlert("파티를 편성하고 다시 진행해주세요.", "error");
                    return;
                }
                window.location.href = '/stage-select';
            },
            
            togglePartyMember(char) {
                const idx = this.currentParty.findIndex(p => p && p.id === char.id);
                if (idx !== -1) {
                    this.currentParty[idx] = null;
                } else {
                    const emptySlot = this.currentParty.findIndex(p => p === null);
                    if (emptySlot !== -1) this.currentParty[emptySlot] = char;
                }
            },

            async saveParty() {
                const ids = this.currentParty.map(p => p ? p.id : null);
                try {
                    const res = await fetch('/api/lobby/save-party', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ partyIds: ids })
                    });
                    if (res.ok) this.showAlert("편성이 저장되었습니다.", "success");
                } catch (e) { console.error(e); }
            },

            async drawGacha(count) {
                this.isGachaAnimating = true;
                this.gachaResults = [];
                try {
                    const res = await fetch('/api/gacha/draw?count=' + count, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        setTimeout(() => {
                            this.gachaResults = data.results.map((r, i) => ({ ...r, revealed: false, _idx: i }));
                            this.isGachaAnimating = false;
                            this.loadPlayerInfo();
                            this.loadMyCharacters();
                        }, 1500);
                    } else {
                        this.showAlert(data.message || "영입 실패", "error");
                        this.isGachaAnimating = false;
                    }
                } catch (e) { 
                    console.error(e);
                    this.isGachaAnimating = false;
                }
            },

            revealCard(idx) {
                if (this.gachaResults[idx]) {
                    this.gachaResults[idx].revealed = true;
                }
            },

            revealAllCards() {
                let delay = 0;
                this.gachaResults.forEach((r, i) => {
                    setTimeout(() => { this.gachaResults[i].revealed = true; }, delay);
                    delay += 120;
                });
            },

            allCardsRevealed() {
                return this.gachaResults.length > 0 && this.gachaResults.every(r => r.revealed);
            },

            getRarityClass(rarity) {
                return 'rarity-' + (rarity || 'C');
            },

            getRarityBadgeClass(rarity) {
                return 'rarity-badge rarity-badge-' + (rarity || 'C');
            },

            async claimLevelReward(lvl) {
                try {
                    const res = await fetch('/api/lobby/claim-level-reward', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ level: lvl })
                    });
                    const data = await res.json();
                    if (data.success) {
                        this.showAlert(data.message, "success");
                        this.loadPlayerInfo();
                    } else {
                        this.showAlert(data.message, "error");
                    }
                } catch (e) { console.error(e); }
            },

            async claimActReward(act) {
                try {
                    const res = await fetch('/api/lobby/claim-act-reward', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ act: act })
                    });
                    const data = await res.json();
                    if (data.success) {
                        this.showAlert(data.message, "success");
                        this.loadPlayerInfo();
                    } else {
                        this.showAlert(data.message, "error");
                    }
                } catch (e) { console.error(e); }
            },

            generateTowerEnemies(floor) {
                const pool = [
                    {name:'혈교 도수',role:'전위 돌격병'},{name:'혈교 암자객',role:'후방 자객'},
                    {name:'혈교 도사',role:'지원 술사'},{name:'혈교 호법',role:'근위 호법'},
                    {name:'마교 궁수',role:'원거리 사수'},{name:'마교 역사',role:'중장 역사'}
                ];
                const count = Math.min(3 + Math.floor((floor-1)/5), 6);
                const baseLv = floor * 2 + 3;
                let enemies = [];
                for (let i = 0; i < count; i++) {
                    const t = pool[i % pool.length];
                    enemies.push({name:t.name,role:t.role,level:baseLv+Math.floor(Math.random()*3),isBoss:false});
                }
                if (floor % 5 === 0) {
                    const bosses = ['혈교 장로','혈교 부교주','마교 호법왕','마교 좌사','마교 교주'];
                    enemies.push({name:bosses[Math.min(Math.floor(floor/5)-1,bosses.length-1)],role:'두목',level:baseLv+10,isBoss:true});
                }
                return enemies;
            },

            getDailyDungeons() {
                const day = new Date().getDay();
                return [
                    {name:'금속의 시련',desc:'공격력 성장 재료',days:[1,4],icon:'swords',color:'amber'},
                    {name:'목기의 시련',desc:'방어력 성장 재료',days:[2,5],icon:'shield',color:'emerald'},
                    {name:'수기의 시련',desc:'체력 성장 재료',days:[3,6],icon:'heart',color:'sky'},
                    {name:'화기의 시련',desc:'속도 성장 재료',days:[1,3,5],icon:'flame',color:'red'},
                    {name:'토기의 시련',desc:'종합 성장 재료',days:[0,6],icon:'mountain',color:'yellow'}
                ].map(d=>({...d,isAvailable:d.days.includes(day),stage:this.hallStage}));
            },

            get filteredCharacters() {
                if (this.inventoryFilter === 'ALL') return this.myCharacters;
                return this.myCharacters.filter(c => c.rarity === this.inventoryFilter);
            },

            async claimQuestReward() {
                try {
                    const res = await fetch('/api/quest/claim', { method: 'POST' });
                    const data = await res.json();
                    if (data.success) {
                        this.showAlert('보상을 수령했습니다!', "success");
                        await this.loadPlayerInfo();
                        await this.fetchQuestInfo();
                        this.closeModal();
                    } else { this.showAlert(data.error || '수령 실패', "error"); }
                } catch(e) { console.error(e); }
            }
        }));
    });
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body x-data="lobbyApp">
    <div class="bg-layer">
        <img th:src="@{/images/bg_mainss.png}" alt="bg" loading="eager">
    </div>

    <div x-show="isLoading" class="fixed inset-0 z-[100] bg-[#0a0e1a] flex items-center justify-center">
        <div class="text-center">
            <div class="w-10 h-10 border-2 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-slate-400 text-sm tracking-widest serif">입장 중...</p>
        </div>
    </div>

    <div class="char-wrap" x-show="!isLoading">
        <img :src="currentLobbyCharacter.src" loading="lazy">
    </div>

    <div class="relative z-10 w-screen h-screen flex flex-col justify-between pointer-events-none p-6" x-show="!isLoading">
        <header class="flex justify-between items-start pointer-events-auto">
            <div class="flex flex-col gap-4">
                <button @click="openModal('MY_PROFILE')" class="glass-panel-circle pr-6 pl-2 py-2 flex items-center gap-3 hover:bg-white/10 transition">
                    <div class="w-12 h-12 rounded-full border-2 border-amber-500/50 overflow-hidden bg-black/80">
                        <img :src="playerPortrait" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-white font-bold text-lg serif" x-text="playerNickname"></span>
                            <span class="bg-amber-600 text-[10px] px-1.5 py-0.5 rounded font-bold">Lv.<span x-text="level"></span></span>
                        </div>
                        <div class="w-32 h-1.5 bg-black/40 rounded-full overflow-hidden border border-white/5">
                            <div class="h-full jade-bar transition-all duration-500" :style="'width:' + (exp/requiredExp*100) + '%'"></div>
                        </div>
                    </div>
                </button>

                <div class="flex gap-2">
                    <div class="glass-panel px-4 py-2 flex items-center gap-3 animate-cp border-amber-500/20">
                        <i data-lucide="swords" class="text-amber-500 w-5 h-5"></i>
                        <div>

                        <p class="text-sm">수신된 우편이 없습니다.</p>
                    </div>

                    <div class="flex-1 overflow-y-auto custom-scrollbar space-y-3 pr-1" x-show="mails.length > 0">
                        <template x-for="mail in mails" :key="mail.id">
                            <div class="p-5 rounded-2xl border transition"
                                 :class="mail.isRead ? 'bg-slate-800/30 border-white/5' : 'bg-sky-900/20 border-sky-500/30'">
                                <div class="flex justify-between items-start mb-2">
                                    <div class="flex items-center gap-2">
                                        <span x-show="!mail.isRead" class="w-2 h-2 rounded-full bg-sky-400 animate-pulse shrink-0"></span>
                                        <h5 class="text-white font-bold serif" x-text="mail.title"></h5>
                                    </div>
                                    <span class="text-slate-500 text-[10px] shrink-0" x-text="mail.createdAt.substring(0, 10)"></span>
                                </div>
                                <p class="text-slate-400 text-xs mb-4 leading-relaxed" x-text="mail.content"></p>
                                <div class="flex justify-between items-center">
                                    <div class="flex gap-4">
                                        <div x-show="mail.rewardGold > 0" class="flex items-center gap-1.5 text-yellow-400">
                                            <i data-lucide="coins" class="w-4 h-4"></i>
                                            <span class="font-bold text-sm" x-text="mail.rewardGold.toLocaleString()"></span>
                                        </div>
                                        <div x-show="mail.rewardGems > 0" class="flex items-center gap-1.5 text-cyan-400">
                                            <i data-lucide="gem" class="w-4 h-4"></i>
                                            <span class="font-bold text-sm" x-text="mail.rewardGems.toLocaleString()"></span>
                                        </div>
                                        <div x-show="mail.rewardGold === 0 && mail.rewardGems === 0" class="text-slate-600 text-xs">보상 없음</div>
                                    </div>
                                    <button @click="claimMail(mail.id)"
                                            :disabled="mail.isClaimed"
                                            class="px-5 py-1.5 rounded-lg font-bold text-xs transition active:scale-95"
                                            :class="mail.isClaimed ? 'bg-slate-700 text-slate-500 cursor-not-allowed' : 'bg-gradient-to-r from-sky-600 to-sky-500 text-white hover:from-sky-500 hover:to-sky-400 shadow-lg'">
                                        <span x-text="mail.isClaimed ? '수령 완료' : '수령'"></span>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- [PORTRAIT_SELECT] 초상화 변경 -->
            <template x-if="currentModal==='PORTRAIT_SELECT'">
                <div class="glass-panel w-full max-w-4xl mx-auto flex flex-col p-8 shadow-2xl border-white/20" style="height:80vh;">
                    <div class="flex justify-between items-center mb-6 border-b border-white/5 pb-4">
                        <div>
                            <h2 class="text-3xl font-bold serif text-white flex items-center gap-3"><i data-lucide="user-circle"></i> 초상화 변경</h2>
                            <p class="text-slate-400 text-sm mt-1">대협의 얼굴이 될 초상화를 선택하세요.</p>
                        </div>
                        <button @click="openModal('MY_PROFILE')" class="glass-button w-10 h-10 rounded-full flex items-center justify-center hover:bg-red-600 transition"><i data-lucide="arrow-left"></i></button>
                    </div>
                    <div class="flex-1 overflow-y-auto custom-scrollbar pr-2">
                        <div class="grid grid-cols-5 gap-6">
                            <template x-for="char in myCharacters" :key="char.id">
                                <button @click="selectPortrait(char.src)" class="glass-panel p-2 transition hover:bg-white/10 relative group border-2" :class="char.src === playerPortrait ? 'border-amber-500' : 'border-transparent'">
                                    <div x-show="char.src === playerPortrait" class="absolute top-2 left-2 z-10 bg-amber-500 text-black text-[9px] px-2 py-0.5 rounded font-bold">적용 중</div>
                                    <div class="aspect-square overflow-hidden rounded-full bg-black/40 border-2 border-slate-700"><img :src="char.src" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"></div>
                                    <p class="text-white font-bold text-xs serif mt-2 text-center" x-text="char.name"></p>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- [ILLUSTRATION_SELECT] 대표 일러스트 변경 -->
            <template x-if="currentModal==='ILLUSTRATION_SELECT'">
                <div class="glass-panel w-full max-w-4xl mx-auto flex flex-col p-8 shadow-2xl border-white/20" style="height:80vh;">
                    <div class="flex justify-between items-center mb-6 border-b border-white/5 pb-4">
                        <div>
                            <h2 class="text-3xl font-bold serif text-white flex items-center gap-3"><i data-lucide="image"></i> 대표 일러스트 변경</h2>
                            <p class="text-slate-400 text-sm mt-1">로비 화면을 장식할 동료를 선택하세요.</p>
                        </div>
                        <button @click="openModal('MY_PROFILE')" class="glass-button w-10 h-10 rounded-full flex items-center justify-center hover:bg-red-600 transition"><i data-lucide="arrow-left"></i></button>
                    </div>
                    <div class="flex-1 overflow-y-auto custom-scrollbar pr-2">
                        <div class="grid grid-cols-4 gap-4">
                            <template x-for="char in myCharacters" :key="char.id">
                                <button @click="selectMainIllustration(char.id)" class="glass-panel p-2 transition hover:bg-white/10 relative group border-2" :class="char.id === serverMainCharacterId ? 'border-amber-500' : 'border-transparent'">
                                    <div x-show="char.id === serverMainCharacterId" class="absolute top-2 left-2 z-10 bg-amber-500 text-black text-[9px] px-2 py-0.5 rounded font-bold">적용 중</div>
                                    <div class="aspect-[3/4] overflow-hidden rounded-lg bg-black/40"><img :src="char.src" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"></div>
                                    <p class="text-white font-bold text-sm serif mt-2 text-center" x-text="char.name"></p>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- [CHAR_DETAIL] 캐릭터 상세 보기 -->
            <template x-if="currentModal==='CHAR_DETAIL' && selectedCharForDetail">
                <div class="glass-panel w-full max-w-5xl mx-auto p-8 shadow-2xl border-purple-500/20 flex gap-8" style="height:85vh;">
                    <!-- 좌측: 일러스트 및 기본 태그 -->
                    <div class="w-2/5 flex flex-col gap-4">
                        <div class="flex-1 rounded-2xl overflow-hidden bg-black/40 border border-white/10 relative">
                            <div class="absolute top-4 left-4 z-10 flex flex-col gap-2">
                                <span class="text-lg px-3 py-1 rounded font-black shadow-lg" :class="{'S':'bg-amber-500 text-black','A':'bg-purple-500 text-white','B':'bg-blue-500 text-white','C':'bg-slate-500 text-white'}[selectedCharForDetail.rarity]" x-text="selectedCharForDetail.rarity + '급'"></span>
                                <span class="bg-slate-900/80 backdrop-blur-md text-cyan-400 px-3 py-1 rounded text-xs font-bold border border-cyan-500/30" x-text="selectedCharForDetail.realm || '경지 미설정'"></span>
                            </div>
                            <img :src="selectedCharForDetail.src" class="w-full h-full object-cover">
                        </div>
                        
                        <!-- 배경 정보 요약 -->
                        <div class="bg-slate-900/60 rounded-xl p-4 border border-white/5 grid grid-cols-2 gap-3 text-[11px]">
                            <div class="flex flex-col gap-1">
                                <span class="text-slate-500">소속</span>
                                <span class="text-white font-bold" x-text="selectedCharForDetail.faction || '-'"></span>
                            </div>
                            <div class="flex flex-col gap-1">
                                <span class="text-slate-500">성별/나이</span>
                                <span class="text-white font-bold"><span x-text="selectedCharForDetail.gender || '-'"></span> / <span x-text="selectedCharForDetail.age || '-'"></span></span>
                            </div>
                            <div class="flex flex-col gap-1">
                                <span class="text-slate-500">성향</span>
                                <span class="text-white font-bold" x-text="selectedCharForDetail.alignment || '-'"></span>
                            </div>
                            <div class="flex flex-col gap-1">
                                <span class="text-slate-500">주요 관계</span>
                                <span class="text-white font-bold truncate" :title="selectedCharForDetail.relationships" x-text="selectedCharForDetail.relationships || '-'"></span>
                            </div>
                        </div>
                    </div>

                    <!-- 우측: 스탯 및 상세 설명 -->
                    <div class="w-3/5 flex flex-col">
                        <div class="mb-6 border-b border-white/10 pb-4">
                            <h2 class="text-4xl font-black text-white serif mb-1" x-text="selectedCharForDetail.name"></h2>
                            <p class="text-amber-500/80 text-sm italic mb-2" x-text="selectedCharForDetail.title"></p>
                            <div class="flex items-center gap-3">
                                <span class="text-amber-500 font-bold text-lg">Lv. <span x-text="selectedCharForDetail.level"></span></span>
                                <span class="text-slate-400 text-sm" x-text="selectedCharForDetail.role"></span>
                            </div>
                            <!-- 경험치 바 -->
                            <div class="mt-2 w-full max-w-xs">
                                <div class="flex justify-between text-[10px] text-slate-500 mb-1">
                                    <span>수련 진척도</span>
                                    <span x-text="selectedCharForDetail.exp + ' / ' + selectedCharForDetail.requiredExp"></span>
                                </div>
                                <div class="w-full h-1 bg-black/40 rounded-full overflow-hidden border border-white/5">
                                    <div class="h-full bg-gradient-to-r from-amber-600 to-amber-400 transition-all duration-500" :style="'width:' + (selectedCharForDetail.exp / selectedCharForDetail.requiredExp * 100) + '%'"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 스탯 그리드 -->
                        <div class="grid grid-cols-2 gap-3 mb-6">
                            <div class="bg-slate-800/40 p-3 rounded-xl border border-white/5 flex justify-between items-center">
                                <span class="text-slate-500 text-[11px]">체력 (HP)</span>
                                <span class="text-white font-bold font-mono" x-text="(selectedCharForDetail.hp || 0).toLocaleString()"></span>
                            </div>
                            <div class="bg-slate-800/40 p-3 rounded-xl border border-white/5 flex justify-between items-center">
                                <span class="text-slate-500 text-[11px]">공격력 (ATK)</span>
                                <span class="text-white font-bold font-mono" x-text="(selectedCharForDetail.atk || 0).toLocaleString()"></span>
                            </div>
                            <div class="bg-slate-800/40 p-3 rounded-xl border border-white/5 flex justify-between items-center">
                                <span class="text-slate-500 text-[11px]">방어력 (DEF)</span>
                                <span class="text-white font-bold font-mono" x-text="(selectedCharForDetail.def || 0).toLocaleString()"></span>
                            </div>
                            <div class="bg-slate-800/40 p-3 rounded-xl border border-white/5 flex justify-between items-center">
                                <span class="text-slate-500 text-[11px]">속도 (SPD)</span>
                                <span class="text-white font-bold font-mono" x-text="selectedCharForDetail.spd || 0"></span>
                            </div>
                        </div>

                        <!-- 전투력 수치 (강조) -->
                        <div class="bg-gradient-to-r from-purple-900/40 to-blue-900/40 p-4 rounded-xl border border-purple-500/30 flex justify-between items-center mb-6 shadow-lg shadow-purple-900/20">
                            <div class="flex items-center gap-2">
                                <i data-lucide="zap" class="text-purple-400 w-5 h-5"></i>
                                <span class="text-purple-300 font-bold text-sm tracking-widest">개인 무력</span>
                            </div>
                            <span class="text-3xl text-white font-black font-mono tracking-tighter" x-text="(selectedCharForDetail.power || 0).toLocaleString()"></span>
                        </div>

                        <!-- 배경 설명 (스크롤 영역) -->
                        <div class="flex-1 flex flex-col min-h-0 bg-black/20 rounded-xl border border-white/5 p-4">
                            <h3 class="text-xs font-bold text-slate-500 mb-3 flex items-center gap-2">
                                <i data-lucide="book-open" class="w-3 h-3"></i> 인물 일대기
                            </h3>
                            <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                                <p class="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap" x-text="selectedCharForDetail.lore || '아직 알려진 기록이 없습니다.'"></p>
                            </div>
                        </div>

                        <div class="mt-6 flex justify-end gap-3">
                            <button @click="openModal('INVENTORY')" class="glass-button px-8 py-2.5 rounded-xl text-sm font-bold border border-white/10 hover:bg-white/5 transition">닫기</button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Global Alert Modal -->
    <div x-show="alertState.show" class="fixed inset-0 z-[1000] flex items-center justify-center p-4 pointer-events-none">
        <div x-show="alertState.show" x-transition.opacity class="absolute inset-0 bg-black/60 backdrop-blur-sm pointer-events-auto" @click="closeAlert()"></div>
        <div x-show="alertState.show" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-90 translate-y-4" x-transition:enter-end="opacity-100 scale-100 translate-y-0" 
             class="relative z-10 glass-panel p-8 max-w-sm w-full flex flex-col items-center text-center pointer-events-auto border-amber-500/30">
            <div class="w-16 h-16 rounded-full mb-4 flex items-center justify-center border-2"
                 :class="{'bg-emerald-500/10 border-emerald-500/30 text-emerald-400': alertState.type === 'success',
                          'bg-red-500/10 border-red-500/30 text-red-400': alertState.type === 'error',
                          'bg-amber-500/10 border-amber-500/30 text-amber-500': alertState.type === 'info'}">
                <i :data-lucide="alertState.type === 'success' ? 'check-circle' : (alertState.type === 'error' ? 'alert-triangle' : 'info')" class="w-8 h-8"></i>
            </div>
            <h3 class="text-xl font-bold text-white mb-2 serif">알림</h3>
            <p class="text-slate-400 text-sm mb-6" x-text="alertState.message"></p>
            <button @click="closeAlert()" class="bg-gradient-to-r from-amber-600 to-amber-500 text-white font-bold py-2.5 px-8 rounded-xl w-full shadow-lg hover:from-amber-500 hover:to-amber-400 transition active:scale-95">확인</button>
        </div>
    </div>
</body>
</html>
