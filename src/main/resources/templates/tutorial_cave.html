<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>튜토리얼 - 비경 동굴</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">

    <!-- Tailwind CSS (CDN for development) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Pretendard', sans-serif; }
        
        .gowun-batang { font-family: 'Gowun Batang', serif; }
        
        /* 캔버스 화면 꽉 채우기 */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
        }

        /* 픽셀 아트 선명하게 유지 */
        canvas {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* 동굴 분위기를 위한 어두운 오버레이 효과 */
        .cave-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.8) 80%, rgba(0,0,0,1) 100%);
            z-index: 15;
            pointer-events: none;
        }

        /* 플레이어 시야 조명 (AlpineJS로 위치 이동) */
        .player-light {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.15) 0%, transparent 60%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 16;
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
        }

        /* UI 레이어는 캔버스/비네트 위로 */
        .ui-layer {
            position: relative;
            z-index: 20;
            pointer-events: none;
        }
        
        .interactive-ui {
            pointer-events: auto;
        }

        /* 전투 전환 플래시 효과 */
        .battle-flash {
            position: absolute;
            inset: 0;
            background-color: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        
        .battle-flash.active {
            opacity: 1;
        }
    </style>
</head>
<body x-data="caveApp()">

    <!-- 동굴 바닥/엔티티 캔버스 -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- 어두운 동굴 비네트 효과 -->
    <div class="cave-vignette"></div>

    <!-- 플레이어 등불 효과 -->
    <div class="player-light" :style="`left: ${playerScreenX}px; top: ${playerScreenY}px;`"></div>

    <!-- 전투 전환 플래시 -->
    <div id="battleFlash" class="battle-flash"></div>

    <!-- 가이드 메시지 (WASD 이동 안내) -->
    <div class="ui-layer absolute top-20 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2" x-show="showGuide" x-transition.opacity>
        <div class="bg-black/60 border border-slate-700 px-6 py-3 rounded-lg backdrop-blur-sm text-center">
            <p class="text-white text-lg gowun-batang"><kbd class="px-2 py-1 bg-slate-800 rounded border border-slate-600 font-sans mx-1">W</kbd><kbd class="px-2 py-1 bg-slate-800 rounded border border-slate-600 font-sans mx-1">A</kbd><kbd class="px-2 py-1 bg-slate-800 rounded border border-slate-600 font-sans mx-1">S</kbd><kbd class="px-2 py-1 bg-slate-800 rounded border border-slate-600 font-sans mx-1">D</kbd> 이동</p>
            <p class="text-slate-400 text-sm mt-1">동굴 안쪽으로 전진하십시오.</p>
        </div>
    </div>

    <!-- 스페이스 상호작용 프롬프트 -->
    <div x-show="showInteractPrompt" 
         x-transition.opacity
         class="ui-layer absolute inset-0 flex items-center justify-center pb-32 pt-20">
        <div class="bg-red-900/90 border-2 border-red-500 px-6 py-3 rounded-md animate-bounce shadow-[0_0_15px_rgba(239,68,68,0.5)]">
            <span class="text-white text-lg"><strong class="text-red-400 gowun-batang text-xl mr-2">SPACE</strong> <span x-text="promptText">상호작용</span></span>
        </div>
    </div>

    <!-- 나레이션/대사 모달 -->
    <div x-show="currentDialog" class="ui-layer absolute bottom-10 left-1/2 -translate-x-1/2 w-[800px] max-w-[90vw]">
        <div class="bg-black/80 border border-slate-700 p-6 rounded-lg backdrop-blur-md">
            <h3 class="text-amber-400 font-bold gowun-batang text-xl mb-2" x-text="dialogSpeaker"></h3>
            <p class="text-white text-lg leading-relaxed">
                <span x-text="displayedDialogText"></span><span class="animate-pulse" x-show="isTyping">|</span>
            </p>
            <p class="text-slate-500 text-sm mt-4 text-right animate-pulse" x-show="!isTyping">클릭 또는 SPACE 하여 계속 ▼</p>
        </div>
    </div>

    <!-- 타임 스킵 연출 모달 -->
    <div x-show="showTimeSkip"
         x-transition.opacity.duration.2000ms
         class="ui-layer absolute inset-0 flex flex-col items-center justify-center bg-black z-50">
        <p class="gowun-batang text-3xl text-white tracking-[0.5em] mb-4" x-text="timeSkipText">수개월 후...</p>
        <div class="w-24 h-px bg-white/50"></div>
    </div>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- 동굴 로직 분리 -->
    <script src="/js/tutorial_cave.js"></script>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
