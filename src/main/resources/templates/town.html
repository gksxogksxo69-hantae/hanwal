<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한월(韓月) - 로비</title>
    <link rel="icon" th:href="@{/images/favicon.svg}" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { box-sizing: border-box }
        body {
            margin: 0; overflow: hidden; background: #0a0e1a;
            font-family: 'Pretendard', sans-serif; color: #fff
        }
        .serif { font-family: 'Gowun Batang', serif }
        .bg-layer { position: absolute; inset: 0; z-index: 0 }
        .bg-layer img { width: 100%; height: 100%; object-fit: cover; opacity: .45 }
        .char-wrap {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-55%);
            height: 92vh; z-index: 2; pointer-events: none;
            -webkit-mask-image: linear-gradient(to bottom, #000 65%, transparent);
            mask-image: linear-gradient(to bottom, #000 65%, transparent);
        }
        .char-wrap img { height: 100%; object-fit: contain }
        .panel { background: rgba(10, 14, 26, .8); border: 1px solid rgba(255, 255, 255, .08); border-radius: 9999px }
        .panel-box { background: rgba(10, 14, 26, .85); border: 1px solid rgba(255, 255, 255, .08); border-radius: 12px }
        .top-nav-btn {
            position: relative; width: 46px; height: 46px; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: rgba(255, 255, 255, .7); cursor: pointer; background: rgba(10, 14, 26, .65);
            border: 1px solid rgba(255, 255, 255, .1); transition: all .2s; backdrop-filter: blur(4px);
        }
        .top-nav-btn:hover { background: rgba(255, 255, 255, .15); color: #fff; transform: translateY(-2px); border-color: rgba(255, 255, 255, .3); }
        .skew { transform: skewX(-12deg); transition: background .15s }
        .skew-inner { transform: skewX(12deg) }
        .btn-main { background: #b45309; border-right: 3px solid #fbbf24 }
        .btn-main:hover { background: #d97706 }
        .btn-sub { background: rgba(20, 27, 45, .95); border: 1px solid rgba(255, 255, 255, .08); border-right: 3px solid #a78bfa }
        .btn-sub:hover { background: rgba(40, 50, 70, .95) }
        .r-card {
            flex: 1; position: relative; border-radius: 8px; overflow: hidden;
            background: rgba(15, 20, 30, .95); border: 1px solid rgba(255, 255, 255, .06);
            cursor: pointer; transition: transform .15s, border-color .15s;
        }
        .r-card:hover { transform: translateY(-6px); border-color: rgba(255, 255, 255, .25) }
        .r-card img { width: 100%; height: 100%; object-fit: cover; object-position: center 15% }
        .r-card-info {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 24px 16px 16px;
            background: linear-gradient(to top, rgba(0, 0, 0, .95), rgba(0, 0, 0, .3) 80%, transparent);
        }
        .r-empty {
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            color: rgba(255, 255, 255, .2); border: 2px dashed rgba(255, 255, 255, .15);
        }
        .r-empty:hover { border-style: solid; color: rgba(255, 255, 255, .5); background: rgba(255, 255, 255, .03) }
        @keyframes guidePulse { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
        @keyframes guideGlow { 0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); } 70% { box-shadow: 0 0 0 18px rgba(245, 158, 11, 0); } 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); } }
        .guide-pulse { animation: guidePulse 1.5s infinite; position: relative; z-index: 60; }
        .guide-glow { animation: guideGlow 1.5s infinite; position: relative; z-index: 60; }
    </style>
    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('lobbyApp', () => ({
            // ── 유저 정보 ──
            playerGender: 'MALE', playerNickname: '모험가', playerLevel: 1, playerExp: 0, playerNextLevelExp: 100,
            playerGold: 0, playerGems: 0, claimedLevelRewards: "", currentModal: null, modalTitle: '', isLoading: true, customPortrait: null,
            gachaResults: [], isGachaAnimating: false, myCharacters: [], currentCharIndex: 0, currentParty: [null, null, null, null],
            combatPower: 0, partyCombatPower: 0, serverRank: '--', towerFloor: 1, hallStage: 1, raidStage: 1, maxClearedStageId: 0, claimedActRewards: "",
            currentQuest: { id: 0, title: '로딩 중...', goalDesc: '데이터 동기화 중...', status: 'IN_PROGRESS', rewardGold: 0, rewardGems: 0 },
            stages: [], currentChapter: 1, selectedPartySlot: 0,
            guideStep: 0, guideActive: false, guideMonologueText: '', guideTyping: false, guideMonologueLines: [], guideMonologueIndex: 0, guideTypeInterval: null,

            async init() {
                await this.loadPlayerInfo();
                await this.loadMyCharacters();
                if (typeof this.fetchQuestInfo === 'function') await this.fetchQuestInfo();
                const mainCharSrc = this.currentLobbyCharacter.src;
                if (mainCharSrc) {
                    await new Promise(resolve => {
                        const img = new Image(); img.onload = resolve; img.onerror = resolve; img.src = mainCharSrc;
                    });
                }
                this.isLoading = false;
                this.checkGuideStart();
                this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
            },

            async loadPlayerInfo() {
                try {
                    const res = await fetch('/api/map/player-info');
                    const data = await res.json();
                    if (data.success) {
                        this.playerGender = data.gender || 'MALE';
                        this.playerNickname = data.nickname || '모험가';
                        this.playerLevel = data.level || 1;
                        this.playerExp = data.exp || 0;
                        this.playerNextLevelExp = data.nextLevelExp || 100;
                        this.playerGold = data.gold || 0;
                        this.playerGems = data.premiumCurrency || 0;
                        this.claimedLevelRewards = data.claimedLevelRewards || "";
                        this.combatPower = data.totalPower || 0;
                        this.partyCombatPower = data.partyPower || 0;
                        this.serverRank = data.serverRank || '--';
                        this.towerFloor = data.towerFloor || 1;
                        this.hallStage = data.hallStage || 1;
                        this.raidStage = data.raidStage || 1;
                        this.maxClearedStageId = data.maxClearedStageId || 0;
                        this.claimedActRewards = data.claimedActRewards || "";
                        if (data.mainCharacterId) this.serverMainCharacterId = data.mainCharacterId;
                        if (data.profileImagePath) this.customPortrait = data.profileImagePath;
                    }
                } catch (e) { console.warn('Player info error:', e); }
            },

            async fetchQuestInfo() {
                try {
                    const res = await fetch('/api/quest/current');
                    if (res.ok) this.currentQuest = await res.json();
                } catch (e) { console.error("Quest error:", e); }
            },

            async fetchStages() {
                try {
                    const res = await fetch(`/api/dungeon/stages/${this.currentChapter}`);
                    if (res.ok) {
                        this.stages = await res.json();
                        this.$nextTick(() => lucide.createIcons());
                    }
                } catch (e) { console.error("Stages error:", e); }
            },

            async handleQuestClick() {
                if (this.currentQuest.status === 'COMPLETED') this.openModal('QUEST_REWARD');
                else this.goToStory();
            },

            async loadMyCharacters() {
                let savedSlots = [null, null, null, null];
                try {
                    const res = await fetch('/api/lobby/my-characters');
                    const data = await res.json();
                    if (data.success && data.characters && data.characters.length > 0) {
                        this.myCharacters = data.characters.map(c => ({
                            id: c.id, name: c.name, src: c.imagePath, desc: c.title || c.role,
                            role: c.role, rarity: c.rarity || 'C', level: c.level, color: this.roleColor(c.role), rarityColor: this.rarityColor(c.rarity || 'C')
                        }));
                        const rankOrder = { 'S': 4, 'A': 3, 'B': 2, 'C': 1 };
                        this.myCharacters.sort((a,b) => rankOrder[b.rarity] - rankOrder[a.rarity]);
                        if (data.party) savedSlots = data.party;
                        if (this.serverMainCharacterId) {
                            const mIdx = this.myCharacters.findIndex(c => Number(c.id) === Number(this.serverMainCharacterId));
                            if (mIdx !== -1) this.currentCharIndex = mIdx;
                        }
                    } else { this.myCharacters = [this.fallbackCharacter()]; }
                } catch (e) { this.myCharacters = [this.fallbackCharacter()]; }
                for (let i = 0; i < 4; i++) {
                    if (savedSlots[i]) this.currentParty[i] = this.myCharacters.find(c => c.id === savedSlots[i]) || null;
                    else this.currentParty[i] = (i < this.myCharacters.length && savedSlots.every(s => !s)) ? this.myCharacters[i] : null;
                }
            },

            fallbackCharacter() {
                return {
                    id: 'protagonist', name: this.playerNickname,
                    src: this.playerGender === 'FEMALE' ? '/images/portrait_female.png' : '/images/portrait_male.png',
                    desc: '여행자', role: '주인공', level: this.playerLevel, color: 'bg-amber-600', rarity: 'S', rarityColor: 'border-amber-500 text-amber-400'
                };
            },

            rarityColor(r) {
                const m = { 'S': 'border-amber-500 text-amber-400', 'A': 'border-purple-500 text-purple-400', 'B': 'border-blue-500 text-blue-400', 'C': 'border-slate-600 text-slate-400' };
                return m[r] || m['C'];
            },
            roleColor(r) {
                const m = { '딜탱': 'bg-red-600', '속도딜러': 'bg-amber-600', '디버퍼': 'bg-purple-600', '전사': 'bg-amber-600', '서포터': 'bg-green-500', '암살자': 'bg-purple-600', '주인공': 'bg-amber-600' };
                return m[r] || 'bg-slate-600';
            },

            get playerPortrait() { return this.customPortrait || (this.playerGender === 'FEMALE' ? '/images/portrait_female.png' : '/images/portrait_male.png'); },
            get currentLobbyCharacter() { return this.myCharacters.length === 0 ? this.fallbackCharacter() : this.myCharacters[this.currentCharIndex % this.myCharacters.length]; },
            nextCharacter() { if (this.myCharacters.length > 1) this.currentCharIndex = (this.currentCharIndex +1) % this.myCharacters.length; },

            openModal(type) {
                const titles = { 'GACHA': '객잔 (영입)', 'PARTY': '편성 (출진)', 'INVENTORY': '보따리 (인벤토리)', 'GUILD': '문파 (길드)', 'DAILY_HALL': '기억의 전당 (던전)', 'STORY_SELECT': '제1막: 남궁의 잔화 (殘花)', 'TOWER': '무한의 탑', 'RAID': '주간 레이드 (토벌)', 'MY_PROFILE': '종합 상태창', 'PROFILE_EDIT': '유저 프로필 설정' };
                if (type === 'STORY_SELECT') this.fetchStages();
                this.modalTitle = titles[type] || '시스템';
                this.currentModal = type;
                this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
            },

            togglePartyMember(char) {
                const existingIdx = this.currentParty.findIndex(p => p && p.id === char.id);
                if (existingIdx !== -1) { this.currentParty[existingIdx] = null; }
                else { this.currentParty[this.selectedPartySlot] = char; this.selectedPartySlot = (this.selectedPartySlot + 1) % 4; if (this.guideStep === 2.1) this.guideStep = 2.2; }
            },

            async saveParty() {
                const slots = this.currentParty.map(c => c ? c.id : null);
                try {
                    const res = await fetch('/api/party/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slots }) });
                    if (res.ok) { this.closeModal(); if (this.guideStep === 2.2) this.guideCompletePartyStep(); }
                } catch (e) { console.error(e); }
            },

            isLevelRewardClaimed(lv) { return this.claimedLevelRewards?.split(',').includes(lv.toString()); },
            isMilestoneReward(lv) { return lv % 10 === 0; },

            async claimLevelReward(lv) {
                if (this.playerLevel < lv || this.isLevelRewardClaimed(lv)) return;
                try {
                    const res = await fetch(`/api/map/claim-level-reward?targetLevel=${lv}`, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) { this.playerGems = data.totalGems; this.claimedLevelRewards = data.claimedLevelRewards; this.$nextTick(() => lucide.createIcons()); }
                } catch (e) { console.error(e); }
            },

            guideOpenParty() { this.openModal('PARTY'); if (this.guideStep === 2) this.guideStep = 2.1; },
            guideCompletePartyStep() { if (this.guideStep >= 2 && this.guideStep < 3) { this.guideStep = 0; setTimeout(() => { this.guideStep = 3; }, 500); } },
            
            checkGuideStart() {
                if (localStorage.getItem('hanwol_lobby_guide_done') === 'true') return;
                if (this.playerLevel < 2) return;
                this.guideActive = true; this.guideStep = 1; this.startGuideMonologue();
            },
            startGuideMonologue() {
                this.guideMonologueLines = this.playerGender === 'MALE' ? ['"...결국 살아남았군."', '"허나 아직 아무것도 끝나지 않았다."', '"천마의 수하들은 중원 곳곳에서 설치고 있고...형님들의 원수는 아직 살아 숨 쉬고 있다."', '"이 검을 갈고, 동료를 모으고, 반드시...피의 대가를 치르게 하리라."'] : ['"...살았어. 나...정말 살아남은 거야."', '"무서웠어. 죽을 뻔했어. 하지만...이제 더 이상 도망치지 않을 거야."', '"오빠들이 지켜주지 못한 이 세상, 이번엔 내가 지켜야 해."', '"이 차가운 힘으로...반드시 원수를 갚을 거야."'];
                this.guideMonologueIndex = 0; this.typeGuideMonologue();
            },
            typeGuideMonologue() {
                if (this.guideMonologueIndex >= this.guideMonologueLines.length) { this.guideStep = 2; return; }
                this.guideTyping = true; const full = this.guideMonologueLines[this.guideMonologueIndex]; this.guideMonologueText = ''; let i = 0;
                clearInterval(this.guideTypeInterval);
                this.guideTypeInterval = setInterval(() => { this.guideMonologueText += full.charAt(i); i++; if (i >= full.length) { clearInterval(this.guideTypeInterval); this.guideTyping = false; } }, 50);
            },
            advanceGuideMonologue() { if (this.guideTyping) { clearInterval(this.guideTypeInterval); this.guideMonologueText = this.guideMonologueLines[this.guideMonologueIndex]; this.guideTyping = false; } else { this.guideMonologueIndex++; if (this.guideMonologueIndex >= this.guideMonologueLines.length) this.guideStep = 2; else this.typeGuideMonologue(); } },
            
            async claimQuestReward() {
                try {
                    const res = await fetch('/api/quest/claim', { method: 'POST' });
                    const data = await res.json();
                    if (data.success) { this.closeModal(); await this.fetchQuestInfo(); await this.loadPlayerInfo(); }
                    else { alert('보상 수령 실패: ' + (data.error || '알 수 없는 오류')); }
                } catch (e) { alert('보상 수령 실패: ' + e.message); }
            },
            async claimEventReward() {
                try {
                    const res = await fetch('/api/map/claim-event-reward', { method: 'POST' });
                    const data = await res.json();
                    if (data.success) { alert(`보석 ${data.gems}개를 수령했습니다!`); await this.loadPlayerInfo(); }
                } catch (e) { alert('오류: ' + e.message); }
            },
            async setMainCharacter(index) {
                this.currentCharIndex = index; this.closeModal();
                try {
                    const charId = this.myCharacters[index].id;
                    await fetch('/api/lobby/main-character', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ characterId: charId }) });
                } catch (e) { console.error(e); }
            },
            async setProfileImage(src) {
                this.customPortrait = src; this.closeModal();
                try { await fetch('/api/lobby/profile-image', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ imagePath: src }) }); }
                catch (e) { console.error(e); }
            },
            async claimActReward(act) {
                try {
                    const res = await fetch(`/api/map/claim-act-reward?act=${act}`, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) { alert(`${act}막 보상 수령 완료!`); this.claimedActRewards = data.claimedActRewards; await this.loadPlayerInfo(); }
                } catch (e) { console.error(e); }
            },
            isActClaimed(act) { return this.claimedActRewards?.split(',').includes(act.toString()); },
            canClaimAct(act) { return this.maxClearedStageId >= (act * 5); },
            async drawGacha(count) {
                const cost = count === 1 ? 150 : 1500;
                if (this.playerGems < cost) { alert('보석이 부족합니다!'); return; }
                this.isGachaAnimating = true;
                try {
                    const res = await fetch(`/api/gacha/draw?count=${count}`, { method: 'POST' });
                    const data = await res.json();
                    if (data.success) { this.playerGems = data.remainingGems; this.gachaResults = data.results; await this.loadMyCharacters(); }
                } catch (e) { console.error(e); }
                this.isGachaAnimating = false;
            },
            goToStory() { window.location.href = '/stage-select'; },
            closeModal() { if (this.guideStep === 2 && this.currentModal === 'PARTY') this.guideCompletePartyStep(); this.currentModal = null; }
        }));
    });
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body x-data="lobbyApp">
    <!-- 배경 -->
    <div class="bg-layer">
        <img th:src="@{/images/bg_mainss.png}" alt="bg" loading="eager">
    </div>

    <!-- 로딩 스피너 -->
    <div x-show="isLoading" class="fixed inset-0 z-[100] bg-[#0a0e1a] flex items-center justify-center">
        <div class="text-center">
            <div class="w-10 h-10 border-2 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-slate-400 text-sm tracking-widest serif">입장 중...</p>
        </div>
    </div>

    <!-- 캐릭터 -->
    <div class="char-wrap">
        <img :src="currentLobbyCharacter.src" :alt="currentLobbyCharacter.name" loading="lazy">
    </div>

    <!-- UI 오버레이 -->
    <div class="relative z-10 w-screen h-screen flex flex-col justify-between pointer-events-none" x-show="!isLoading">
        <!-- 상단 헤더 -->
        <header class="flex justify-between items-start p-5 pointer-events-auto">
            <button @click="openModal('MY_PROFILE')" class="panel pr-5 pl-2 py-1.5 flex items-center gap-3 hover:bg-white/10 transition text-left">
                <div class="w-11 h-11 rounded-full border border-amber-500 overflow-hidden bg-black/60 shrink-0">
                    <img :src="playerPortrait" alt="avatar" class="w-full h-full object-cover">
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <span class="bg-amber-600 text-[10px] px-1.5 rounded font-bold text-white">Lv.<span x-text="playerLevel"></span></span>
                        <span class="font-bold text-base serif text-white" x-text="playerNickname"></span>
                    </div>
                    <div class="text-slate-500 text-[10px]">UID: 800012345</div>
                </div>
            </button>

            <div class="flex flex-col items-end gap-3">
                <div class="flex gap-3 items-center">
                    <div class="panel px-3.5 py-1 flex items-center gap-1.5 text-white">
                        <i data-lucide="coins" class="text-yellow-500 w-3.5 h-3.5"></i>
                        <span class="font-mono text-sm" x-text="playerGold.toLocaleString()"></span>
                    </div>
                    <div class="panel px-3.5 py-1 flex items-center gap-1.5 text-white">
                        <i data-lucide="gem" class="text-cyan-400 w-3.5 h-3.5"></i>
                        <span class="font-mono text-sm" x-text="playerGems.toLocaleString()"></span>
                    </div>
                </div>
                <div class="flex bg-black/40 backdrop-blur-md rounded-2xl border border-white/10 overflow-hidden">
                    <div @click="openModal('GACHA')" class="top-nav-btn border-none"><i data-lucide="wine" class="text-amber-500/80 w-5 h-5 mb-0.5"></i><span class="top-nav-label">객잔</span> </div>
                    <div @click="openModal('TOWER')" class="top-nav-btn border-none"><i data-lucide="castle" class="text-cyan-400 w-5 h-5 mb-0.5"></i><span class="top-nav-label">무한탑</span> </div>
                    <div @click="openModal('RAID')" class="top-nav-btn border-none"><i data-lucide="flame" class="text-red-500 w-5 h-5 mb-0.5"></i><span class="top-nav-label">레이드</span> </div>
                    <div @click="guideOpenParty()" :class="guideStep === 2 ? 'guide-pulse bg-blue-500/20' : ''" class="top-nav-btn border-none"><i data-lucide="users" class="text-blue-400 w-5 h-5 mb-0.5"></i><span class="top-nav-label">편성</span> </div>
                    <div @click="openModal('INVENTORY')" class="top-nav-btn border-none"><i data-lucide="briefcase" class="text-emerald-400 w-5 h-5 mb-0.5"></i><span class="top-nav-label">보따리</span> </div>
                </div>
            </div>
        </header>

        <!-- 중앙 컨텐츠 -->
        <main class="flex-1"></main>

        <!-- 하단 푸터 -->
        <footer class="p-8 flex justify-between items-end pointer-events-auto">
            <div class="flex flex-col gap-3">
                <div class="panel-box p-3 w-72 bg-black/60 backdrop-blur-sm border-l-4 border-l-amber-500">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-amber-500 text-[10px] font-bold tracking-widest">CURRENT QUEST</span>
                        <span class="text-slate-500 text-[10px]" x-text="currentQuest.status === 'COMPLETED' ? '완료' : '진행 중'"></span>
                    </div>
                    <h4 class="text-white font-bold text-sm mb-1 serif" x-text="currentQuest.title"></h4>
                    <p class="text-slate-400 text-[11px] leading-relaxed" x-text="currentQuest.goalDesc"></p>
                </div>
            </div>

            <div class="flex flex-col items-end gap-5">
                <div class="flex gap-4">
                    <button class="panel-box px-8 py-3 bg-black/60 hover:bg-white/5 transition flex flex-col items-center group">
                        <span class="text-slate-500 text-[10px] group-hover:text-amber-500 transition">DAILY HALL</span>
                        <span class="text-white font-bold text-lg serif">기억의 전당</span>
                    </button>
                    <button @click="handleQuestClick()" :class="guideStep === 3 ? 'guide-glow scale-105' : ''" class="skew btn-main px-12 py-3 shadow-[0_0_25px_rgba(180,83,9,0.4)]">
                        <div class="skew-inner flex flex-col items-center">
                            <span class="text-white/70 text-[10px] font-bold">MAIN STORY</span>
                            <span class="text-white font-bold text-xl serif">임무 시작</span>
                        </div>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <!-- 가이드 시스템 -->
    <div x-show="guideActive && guideStep === 1" class="fixed inset-0 z-[80] bg-black/80 flex items-center justify-center p-6 text-white backdrop-blur-sm">
        <div class="max-w-xl w-full panel-box p-10 relative bg-[#0d1117] border-amber-500/30">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 px-6 py-1 bg-amber-600 rounded-full text-[10px] font-bold tracking-widest text-white shadow-lg">INNER MONOLOGUE</div>
            <div class="text-center min-h-[100px] flex items-center justify-center">
                <p class="text-xl lg:text-2xl serif leading-relaxed italic" x-text="guideMonologueText"></p>
            </div>
            <div class="mt-10 flex justify-between items-center text-slate-500 text-[10px] uppercase tracking-widest">
                <button @click="localStorage.setItem('hanwol_lobby_guide_done', 'true'); guideActive = false; guideStep = 0;" class="hover:text-white transition">다시 보지 않기</button>
                <button @click="advanceGuideMonologue()" class="text-amber-500 font-bold hover:text-amber-400 transition animate-pulse">클릭하여 계속</button>
            </div>
        </div>
    </div>

    <div x-show="guideStep === 2" class="fixed top-[110px] right-[130px] z-[70] pointer-events-none">
        <div class="bg-blue-600 text-white rounded-xl px-4 py-2 shadow-2xl relative animate-bounce">
            <p class="text-xs font-bold">파티 편성</p>
            <p class="text-[10px] opacity-90">동료들을 편성하여 출격 준비를 하세요!</p>
            <div class="absolute -top-2 right-10 w-4 h-4 bg-blue-600 rotate-45"></div>
        </div>
    </div>
    <div x-show="guideStep === 2.1" class="fixed top-[40%] left-[50%] -translate-x-1/2 z-[70] pointer-events-none">
        <div class="bg-blue-900/90 border border-blue-400 rounded-xl px-6 py-4 shadow-[0_0_20px_rgba(59,130,246,0.5)] text-center text-white">
            <p class="text-sm font-bold mb-1">동료 배치하기</p>
            <p class="text-blue-100 text-xs">상단의 슬롯을 먼저 클릭하고,<br>하단 목록에서 함께할 동료를 선택하세요!</p>
        </div>
    </div>
    <div x-show="guideStep === 2.2" class="fixed top-[120px] right-[150px] z-[70] pointer-events-none text-white">
        <div class="bg-emerald-900/90 border border-emerald-400 rounded-xl px-4 py-3 shadow-xl">
            <p class="text-emerald-300 text-xs font-bold serif">준비 완료!</p>
            <p class="text-[11px]">편성 확정 버튼을 눌러주세요.</p>
            <div class="absolute -top-2 right-10 w-4 h-4 bg-emerald-900 border-l border-t border-emerald-400 rotate-45"></div>
        </div>
    </div>
    <div x-show="guideStep === 3" class="fixed bottom-[110px] right-[290px] z-[70] pointer-events-none text-white">
        <div class="bg-slate-900/95 border border-amber-500/50 rounded-xl px-4 py-3 shadow-xl max-w-[200px]">
            <p class="text-amber-400 text-xs font-bold mb-1">첫 번째 임무!</p>
            <p class="text-[11px] leading-relaxed">클릭하여 첫 번째 임무에 도전해 보세요.</p>
            <div class="absolute -bottom-2 right-10 w-4 h-4 bg-slate-900/95 border-r border-b border-amber-500/50 rotate-45"></div>
        </div>
    </div>

    <!-- 모달 부모 컨테이너 -->
    <div id="DIV_MODAL_ROOT" class="fixed inset-0 z-50 flex items-center justify-center pointer-events-none">
        <!-- 배경 오버레이 -->
        <div x-show="currentModal" x-transition.opacity class="absolute inset-0 bg-black/60 pointer-events-auto" @click="closeModal()"></div>

        <!-- 모달 컨텐츠 -->
        <div x-show="currentModal" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" class="relative z-10 w-full max-w-5xl px-4 pointer-events-auto">
            
            <!-- [PARTY] 편성 모달 -->
            <template x-if="currentModal==='PARTY'">
                <div class="panel-box w-full flex flex-col bg-[#060a12]/97 p-6 overflow-hidden shadow-2xl relative" style="height: 85vh;">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h2 class="text-3xl font-bold serif text-amber-500 flex items-center gap-3">
                                <i data-lucide="users" class="w-8 h-8"></i> 편성 관리
                            </h2>
                            <p class="text-slate-400 text-sm mt-1">출전할 4명의 동료를 배치하세요.</p>
                        </div>
                        <div class="flex gap-3">
                            <button @click="saveParty()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-8 rounded shadow-lg transition">편성 확정</button>
                            <button @click="closeModal()" class="bg-slate-800 text-white p-2 rounded hover:bg-red-600 transition"><i data-lucide="x" class="w-6 h-6"></i></button>
                        </div>
                    </div>
                    <div class="flex gap-4 mb-8 h-64">
                        <template x-for="(hero, i) in currentParty" :key="i">
                            <div @click="selectedPartySlot = i" :class="selectedPartySlot === i ? 'ring-2 ring-blue-500 ring-offset-4 ring-offset-[#060a12]' : ''" class="r-card">
                                <template x-if="hero">
                                    <div class="w-full h-full relative">
                                        <img :src="hero.src" class="w-full h-full object-cover">
                                        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
                                        <div class="absolute bottom-4 left-4">
                                            <span class="text-[10px] px-1.5 rounded font-bold" :class="hero.color" x-text="hero.role"></span>
                                            <h3 class="text-xl font-bold mt-1 text-white underline decoration-amber-500/30" x-text="hero.name"></h3>
                                        </div>
                                    </div>
                                </template>
                                <template x-if="!hero">
                                    <div class="r-empty w-full h-full"><i data-lucide="plus" class="w-8 h-8 mb-2"></i><span class="text-xs">배치 가능</span> </div>
                                </template>
                            </div>
                        </template>
                    </div>
                    <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
                            <template x-for="char in myCharacters" :key="char.id">
                                <div @click="togglePartyMember(char)" class="panel-box p-2 transition cursor-pointer relative group" :class="currentParty.some(p => p && p.id === char.id) ? 'border-blue-500 bg-blue-500/10' : 'hover:bg-white/5'">
                                    <div class="aspect-[3/4] overflow-hidden rounded bg-slate-800 mb-2">
                                        <img :src="char.src" class="w-full h-full object-cover grayscale transition group-hover:grayscale-0" :class="currentParty.some(p => p && p.id === char.id) ? 'grayscale-0' : ''">
                                    </div>
                                    <div class="flex justify-between items-center px-1">
                                        <span class="text-[10px] font-bold text-white truncate" x-text="char.name"></span>
                                        <span class="text-[9px] font-bold px-1 rounded" :class="rarityColor(char.rarity)" x-text="char.rarity"></span>
                                    </div>
                                    <template x-if="currentParty.some(p => p && p.id === char.id)">
                                        <div class="absolute top-1 right-1 w-5 h-5 bg-blue-500 rounded-full flex items-center justify-center shadow-lg"><i data-lucide="check" class="w-3 h-3 text-white"></i></div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- [GACHA] 객잔 모달 -->
            <template x-if="currentModal==='GACHA'">
                <div class="panel-box w-full max-w-5xl flex flex-col bg-[#060a12]/95 overflow-hidden shadow-2xl relative" style="height: 80vh;">
                    <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/40">
                        <h2 class="text-3xl font-bold serif text-amber-500 flex items-center gap-2"><i data-lucide="wine" class="w-8 h-8"></i> 객잔 (영입)</h2>
                        <button @click="closeModal()" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center hover:bg-red-600 text-white transition"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="flex-1 p-10 flex flex-col items-center justify-center relative bg-[url('/images/bg_mainss.png')] bg-cover bg-center">
                        <div class="absolute inset-0 bg-black/80"></div>
                        <div x-show="!isGachaAnimating && gachaResults.length === 0" class="relative z-10 text-center">
                            <i data-lucide="sparkles" class="w-20 h-20 text-amber-500 mx-auto mb-6 animate-pulse"></i>
                            <p class="text-lg text-slate-300 mb-8 serif">새로운 인연이 대협을 기다리고 있습니다.</p>
                            <div class="flex gap-6 justify-center">
                                <button @click="drawGacha(1)" class="bg-amber-700 hover:bg-amber-600 px-10 py-4 rounded-full font-bold shadow-lg transition">1회 영입 (150)</button>
                                <button @click="drawGacha(10)" class="bg-purple-700 hover:bg-purple-600 px-10 py-4 rounded-full font-bold shadow-lg transition">10회 영입 (1500)</button>
                            </div>
                        </div>
                        <div x-show="isGachaAnimating" class="relative z-10 text-center">
                            <div class="w-20 h-20 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
                            <p class="text-amber-400 font-bold serif animate-pulse">운명을 정하는 중...</p>
                        </div>
                        <div x-show="!isGachaAnimating && gachaResults.length > 0" class="relative z-10 w-full overflow-y-auto max-h-[60vh] p-4 custom-scrollbar">
                            <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                                <template x-for="res in gachaResults">
                                    <div class="panel-box p-3 text-center border-amber-500/30 bg-black/60 backdrop-blur-sm">
                                        <img :src="res.imagePath" class="w-full aspect-square object-cover rounded mb-2 border border-white/5">
                                        <p class="text-xs font-bold text-white mb-1" x-text="res.name"></p>
                                        <span class="text-[9px] px-2 py-0.5 rounded-full font-bold" :class="rarityColor(res.rarity)" x-text="res.rarity + ' RANK'"></span>
                                    </div>
                                </template>
                            </div>
                            <div class="mt-10 text-center"><button @click="gachaResults = []" class="bg-white/10 hover:bg-white/20 text-white px-12 py-3 rounded-full font-bold transition">결과 확인</button></div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- [INVENTORY] 보따리 모달 -->
            <template x-if="currentModal==='INVENTORY'">
                <div class="panel-box w-full max-w-5xl flex flex-col bg-[#060a12]/98 p-8 overflow-hidden shadow-2xl relative" style="height: 80vh;">
                    <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                        <h2 class="text-3xl font-bold serif text-emerald-500 flex items-center gap-3"><i data-lucide="briefcase" class="w-8 h-8"></i> 보따리 (소지품)</h2>
                        <button @click="closeModal()" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center hover:bg-red-600 text-white transition"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                            <template x-for="char in myCharacters" :key="char.id">
                                <div class="panel-box p-3 bg-white/5 border-white/10 hover:border-emerald-500/50 transition">
                                    <img :src="char.src" class="aspect-[3/4] rounded object-cover mb-3 grayscale group-hover:grayscale-0 border border-white/5">
                                    <div class="text-center">
                                        <p class="text-[10px] font-bold text-emerald-500 mb-1" x-text="char.rarity + ' RANK'"></p>
                                        <h4 class="text-white font-bold text-sm serif" x-text="char.name"></h4>
                                        <p class="text-slate-500 text-[10px] mt-1" x-text="'Lv.' + char.level + ' ' + char.role"></p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- [STORY_SELECT] 전장 선택 -->
            <template x-if="currentModal==='STORY_SELECT'">
                <div class="panel-box w-full max-w-5xl flex flex-col bg-[#060a12]/98 p-8 overflow-hidden shadow-2xl relative" style="height: 80vh;">
                    <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
                        <h2 class="text-3xl font-bold serif text-amber-500 flex items-center gap-3"><i data-lucide="map-pin" class="w-8 h-8"></i> 제1막: 남궁의 잔화</h2>
                        <button @click="closeModal()" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center hover:bg-red-600 text-white transition"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 overflow-y-auto pr-2 custom-scrollbar">
                        <template x-for="stage in stages" :key="stage.id">
                            <div @click="goToStory()" class="panel-box p-4 cursor-pointer transition relative group" :class="maxClearedStageId >= (stage.id - 1) ? 'hover:bg-amber-500/10 border-amber-500/40' : 'opacity-40 grayscale pointer-events-none'">
                                <div class="aspect-video bg-slate-900 rounded-lg mb-4 overflow-hidden relative border border-white/5">
                                    <img :src="stage.imagePath || '/images/bg_mainss.png'" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
                                    <div class="absolute bottom-3 left-3">
                    <div class="flex gap-3">
                        <button @click="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-lg transition">나중에</button>
                        <button @click="claimQuestReward()" class="flex-[2] bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-lg shadow-lg transition shadow-amber-900/20">보상 수령</button>
                    </div>
                </div>
            </template>

                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- [LEVEL_REWARDS] 보상 모달 -->
            <template x-if="currentModal==='LEVEL_REWARDS'">
                <div class="panel-box w-full max-w-4xl flex flex-col overflow-hidden shadow-2xl relative" @click.away="closeModal()" style="height: 60vh;">
                    <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/40">
                        <div>
                            <h2 class="text-2xl lg:text-3xl font-bold serif text-amber-500 flex items-center gap-2">
                                <i data-lucide="scroll-text" class="w-8 h-8"></i> 대협의 성장 기록
                            </h2>
                            <p class="text-slate-400 text-sm mt-1">강해질수록 무림의 보상이 기다립니다.</p>
                        </div>
                        <button @click="closeModal()" class="w-10 h-10 rounded-full bg-slate-800/80 border border-white/20 text-slate-300 flex items-center justify-center hover:bg-red-500 hover:text-white transition-all z-10"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="flex-1 overflow-y-auto p-6 bg-[#060a12] custom-scrollbar">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <template x-for="lv in [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60]" :key="lv">
                                <div class="panel-box p-5 flex items-center justify-between transition" :class="isLevelRewardClaimed(lv) ? 'bg-slate-900/50 opacity-60' : (playerLevel >= lv ? 'border-amber-500/50 bg-amber-500/5' : 'bg-black/20')">
                                    <div class="flex items-center gap-4">
                                        <div class="w-14 h-14 rounded-xl flex flex-col items-center justify-center font-bold" :class="isMilestoneReward(lv) ? 'bg-purple-600/20 text-purple-400 border border-purple-500/30' : 'bg-slate-800 text-slate-400'">
                                            <span class="text-[10px] leading-tight">LEVEL</span>
                                            <span class="text-xl leading-none" x-text="lv"></span>
                                        </div>
                                        <div>
                                            <p class="text-white font-bold serif" x-text="lv + '레벨 달성 기념'"></p>
                                            <div class="flex items-center gap-2 mt-1">
                                                <i data-lucide="gem" class="w-3.5 h-3.5 text-cyan-400"></i>
                                                <span class="text-cyan-400 font-mono text-sm font-bold" x-text="isMilestoneReward(lv) ? '1,500' : '300'"></span>
                                            </div>
                                        </div>
                                    </div>
                                    <template x-if="isLevelRewardClaimed(lv)">
                                        <div class="flex items-center gap-1 text-slate-500 font-bold text-sm"><i data-lucide="check-circle" class="w-4 h-4"></i> 수령 완료</div>
                                    </template>
                                    <template x-if="!isLevelRewardClaimed(lv)">
                                        <button @click="claimLevelReward(lv)" :disabled="playerLevel < lv" class="px-5 py-2 rounded font-bold transition text-sm" :class="playerLevel >= lv ? 'bg-amber-600 hover:bg-amber-500 text-white shadow-lg' : 'bg-slate-800 text-slate-600 cursor-not-allowed'">수령하기</button>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</body>
</html>
