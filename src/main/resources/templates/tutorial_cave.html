<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한월(韓月) - 비경에서의 수련</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 커스텀 CSS (프로토타입 스타일 공유) -->
    <link rel="stylesheet" href="/css/tutorial.css">
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- 구글 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; overflow: hidden; background: #000; }
        .font-myeongjo { font-family: 'Nanum Myeongjo', serif; }
        
        /* 동굴 전용 비네팅 강조 */
        .cave-vignette-heavy {
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.8) 70%, #000 100%);
        }
    </style>
</head>
<body>

<div x-data="caveApp()" 
     @click="handleClick" 
     @keydown.window="handleKeydown($event)"
     class="tutorial-container">

    <!-- ===== 배경 레이어 ===== -->
    <div class="bg-layer active bg-dim-effect"
         :style="`background-image: url('/images/prologue_bg_cave.png')`"
         :class="bgEffect"></div>

    <!-- ===== 화면 효과 오버레이 ===== -->
    <div class="screen-overlay cave-vignette-heavy" :class="screenEffect"></div>

    <!-- ===== 나레이션 스택 (소설 스타일) ===== -->
    <div class="narrative-container" id="narrativeContainer">
        <template x-for="(item, idx) in history" :key="idx">
            <div class="narrative-item">
                <div x-show="item.speaker !== '지문'" class="narrative-speaker" x-text="item.speaker"></div>
                <div class="narrative-text font-myeongjo" 
                     :class="{'ji-mun': item.speaker === '지문'}"
                     x-text="item.text"></div>
            </div>
        </template>
        
        <!-- 현재 출력 중인 텍스트 -->
        <div class="narrative-item" x-show="isTyping || (!isTransitioning && currentSceneIndex < scenes.length)">
            <div x-show="currentScene.speaker !== '지문'" class="narrative-speaker" x-text="currentScene.speaker"></div>
            <div class="narrative-text font-myeongjo" 
                 :class="{'ji-mun': currentScene.speaker === '지문'}">
                <span x-text="displayedText"></span>
                <span class="typing-cursor" x-show="isTyping"></span>
            </div>
        </div>
    </div>

    <!-- ===== 전환 레이어 ===== -->
    <div class="scene-transition" x-show="isTransitioning" x-transition.opacity.duration.1500ms>
        <p class="transition-text font-myeongjo" x-text="transitionText"></p>
    </div>

    <!-- ===== 클릭 안내 ===== -->
    <div class="absolute bottom-8 right-8 text-slate-500 text-xs animate-pulse" x-show="!isTyping && !isTransitioning">
        SPACE 또는 클릭으로 전진
    </div>

</div>

<!-- 동굴 로직 JS -->
<script src="/js/tutorial_cave.js"></script>

</body>
</html>
