<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한월(韓月) - 붕괴 스타레일 스타일 무림 로비</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts (Gowun Batang & Pretendard) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; font-family: 'Pretendard', sans-serif; }
        .gowun-batang { font-family: 'Gowun Batang', serif; }
        
        /* 로비 배경 */
        .lobby-bg {
            position: absolute;
            inset: -20px; 
            background-image: url('/images/bg_estate_peace.png');
            background-size: cover;
            background-position: center;
            filter: blur(4px) brightness(0.65);
            z-index: 1;
        }

        /* 벚꽃 잎 흩날리는 효과 */
        .petal {
            position: absolute;
            background-color: #fce4ec;
            border-radius: 15px 0 15px 0;
            opacity: 0.8;
            box-shadow: 0 0 5px rgba(255,192,203,0.5);
            pointer-events: none;
            z-index: 2;
            animation: fall linear infinite, sway ease-in-out infinite alternate;
        }
        @keyframes fall {
            0% { top: -10%; }
            100% { top: 110%; transform: rotate(180deg); }
        }
        @keyframes sway {
            0% { transform: translateX(0px) rotate(0deg); }
            100% { transform: translateX(100px) rotate(45deg); }
        }

        /* 캐릭터 스탠딩 페이드 아웃 */
        @keyframes subtle-float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.01); }
            100% { transform: translateY(0px) scale(1); }
        }
        
        .character-container {
            position: absolute;
            bottom: 0;
            left: 45%;
            transform: translateX(-50%);
            width: 100vw;
            height: 95vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 5;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
        }

        .character-standing {
            height: 100%;
            object-fit: contain;
            animation: subtle-float 5s ease-in-out infinite;
            filter: drop-shadow(0 0 40px rgba(0,0,0,0.6));
            transition: opacity 0.5s ease-in-out;
        }

        /* 캐릭터정보 태그 */
        .char-info-tag {
            position: absolute;
            left: 10%;
            top: 40%;
            z-index: 20;
            pointer-events: auto;
        }

        /* 교체 버튼 */
        .swap-btn {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            padding: 12px;
            color: #fff;
            transition: all 0.3s;
        }
        .swap-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: rotate(180deg) scale(1.1);
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        /* Glassmorphism 베이스 */
        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 우측 사이드 엣지 아이콘 (원형) */
        .side-icon-btn {
            position: relative;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            margin-bottom: 16px;
        }
        .side-icon-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateX(-4px);
        }
        
        .side-icon-label {
            position: absolute;
            right: 70px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transform: translateX(10px);
            transition: all 0.2s;
        }
        .side-icon-btn:hover .side-icon-label {
            opacity: 1;
            transform: translateX(0);
        }

        /* 메인 미션 사선 버튼 (Skew) */
        .action-skew {
            transform: skewX(-15deg);
            overflow: hidden;
            position: relative;
        }
        .action-skew-content {
            transform: skewX(15deg);
        }
        .skew-btn-main {
            background: linear-gradient(135deg, rgba(217, 119, 6, 0.95), rgba(153, 27, 27, 0.95));
            box-shadow: -8px 0 30px rgba(217, 119, 6, 0.3);
            border-right: 4px solid #fcd34d;
        }
        .skew-btn-sub {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 4px solid #a78bfa;
        }

        .skew-btn-hover:hover {
            transform: skewX(-15deg) scale(1.05) translateX(-8px);
            filter: brightness(1.2);
        }

        /* 편성 창 전용 픽업 카드 스타일 */
        .party-overlay {
            background: rgba(4, 9, 20, 0.85); /* 매우 어두운 심연의 색 */
            backdrop-filter: blur(24px);
        }
        
        .roster-card {
            width: 25%;
            height: 75vh;
            position: relative;
            background: linear-gradient(180deg, rgba(30,41,59,0), rgba(15,23,42,0.9));
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .roster-card:hover {
            transform: translateY(-20px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 40px rgba(251, 191, 36, 0.2);
        }

        .roster-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            transition: transform 0.8s ease;
        }
        
        .roster-card:hover img {
            transform: scale(1.08);
        }

        .roster-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 20px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
        }

        .empty-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: rgba(255,255,255,0.2);
            font-size: 3rem;
            border: 2px dashed rgba(255,255,255,0.1);
            background: transparent;
        }
        .empty-slot:hover {
            border-style: solid;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.6);
        }

    </style>
</head>
<body x-data="lobbyApp()">

    <!-- 배경 레이어 -->
    <div class="lobby-bg"></div>

    <!-- 벚꽃 파티클 -->
    <div id="particle-container"></div>

    <!-- 중앙 캐릭터 렌더링 영역 -->
    <div class="character-container">
        <!-- 뷰포트 변경될때 자연스럽게 트랜지션 되도록 x-bind 사용 -->
        <img :src="currentLobbyCharacter.src" :key="currentLobbyCharacter.id" 
             x-transition.opacity.duration.500ms
             class="character-standing" alt="Representative Character">
    </div>

    <!-- 캐릭터 상세 정보 및 대표 캐릭터 교체 버튼 -->
    <div class="char-info-tag flex items-end gap-6">
        <div class="glass-panel p-6 rounded-2xl border-l-4" :class="`border-${currentLobbyCharacter.color.split('-')[1]}-500`">
            <h1 class="text-4xl font-extrabold text-white drop-shadow-md gowun-batang mb-2" x-text="currentLobbyCharacter.name"></h1>
            <p class="font-bold tracking-widest text-sm drop-shadow-md" :class="currentLobbyCharacter.color" x-text="currentLobbyCharacter.desc"></p>
        </div>
        
        <button @click="nextCharacter()" class="swap-btn" title="대표 캐릭터 교체">
            <i data-lucide="refresh-cw" class="w-6 h-6"></i>
        </button>
    </div>

    <!-- UI 레이어 (위 쪽과 양 옆 구조) -->
    <div class="relative z-10 w-screen h-screen overflow-hidden flex flex-col justify-between pointer-events-none">
        
        <!-- 상단 헤더 영역 -->
        <header class="flex justify-between items-start p-6 pointer-events-auto">
            
            <!-- 좌상단: 프로필 (얇고 미니멀하게) -->
            <div class="glass-panel rounded-full pr-6 pl-2 py-2 flex items-center gap-3 cursor-pointer hover:bg-slate-800/80 w-auto">
                <div class="w-12 h-12 rounded-full border border-amber-500 overflow-hidden flex items-center justify-center bg-black/50">
                    <img :src="playerPortrait" alt="Player Portrait" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col justify-center">
                    <div class="flex items-center gap-2">
                        <span class="bg-amber-600 text-white text-[10px] px-1.5 rounded font-bold">Lv.<span x-text="playerLevel"></span></span>
                        <h2 class="text-white font-bold text-lg leading-tight gowun-batang" x-text="playerNickname">모험가</h2>
                    </div>
                    <div class="text-slate-400 text-xs font-medium">UID: 800012345</div>
                </div>
            </div>

            <!-- 우상단: 재화 및 설정 아이콘 -->
            <div class="flex gap-4 items-center">
                <!-- 골드 -->
                <div class="glass-panel px-4 py-1.5 rounded-full flex items-center gap-2">
                    <i data-lucide="coins" class="text-yellow-500 w-4 h-4"></i>
                    <span class="text-white font-mono text-sm tracking-wide" x-text="playerGold.toLocaleString()">0</span>
                </div>
                <!-- 젬 -->
                <div class="glass-panel px-4 py-1.5 rounded-full flex items-center gap-2">
                    <i data-lucide="gem" class="text-cyan-400 w-4 h-4"></i>
                    <span class="text-white font-mono text-sm tracking-wide" x-text="playerGems.toLocaleString()">0</span>
                </div>
                <!-- 작은 아이콘 세트 -->
                <div class="flex gap-2 ml-4">
                    <button class="bg-black/30 hover:bg-white/20 p-2.5 rounded-full text-slate-300 transition backdrop-blur-md">
                        <i data-lucide="mail" class="w-5 h-5"></i>
                    </button>
                    <button class="bg-black/30 hover:bg-white/20 p-2.5 rounded-full text-slate-300 transition backdrop-blur-md">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- 중앙-우측 사이드 엣지 메뉴 (가챠, 파티 등) -->
        <div class="absolute right-6 top-1/2 -translate-y-1/2 flex flex-col items-end pointer-events-auto">
            <button @click="openModal('GACHA')" class="glass-panel side-icon-btn group">
                <i data-lucide="sparkles" class="w-6 h-6"></i>
                <div class="side-icon-label text-amber-300">[객잔] 영입</div>
            </button>
            <button @click="openModal('PARTY')" class="glass-panel side-icon-btn group">
                <i data-lucide="users" class="w-6 h-6"></i>
                <div class="side-icon-label text-blue-300">[편성] 출진</div>
            </button>
            <button @click="openModal('INVENTORY')" class="glass-panel side-icon-btn group">
                <i data-lucide="package" class="w-6 h-6"></i>
                <div class="side-icon-label text-slate-300">[보따리] 인벤토리</div>
            </button>
            <button @click="openModal('GUILD')" class="glass-panel side-icon-btn group">
                <i data-lucide="shield" class="w-6 h-6"></i>
                <div class="side-icon-label text-green-300">[문파] 연합</div>
            </button>
        </div>

        <!-- 우측 하단 대형 메인 시작 버튼 -->
        <div class="absolute bottom-10 right-0 flex flex-col gap-3 pointer-events-auto">
            
            <button @click="openModal('DUNGEON')" class="action-skew skew-btn-sub skew-btn-hover w-72 h-16 mr-[-20px] flex items-center justify-end pr-10 cursor-pointer">
                <div class="action-skew-content flex items-center gap-4">
                    <div class="text-right">
                        <div class="text-purple-300 text-[10px] font-bold tracking-widest uppercase mb-0.5">일일 수련</div>
                        <h3 class="text-white font-bold gowun-batang text-lg">기억의 전당</h3>
                    </div>
                    <div class="bg-purple-500/20 p-2 rounded-full"><i data-lucide="swords" class="text-purple-400 w-5 h-5"></i></div>
                </div>
            </button>
            
            <button @click="goToStory()" class="action-skew skew-btn-main skew-btn-hover w-80 h-24 mr-[-20px] flex items-center justify-end pr-12 cursor-pointer group">
                <div class="action-skew-content flex items-center gap-5">
                    <div class="text-right">
                        <div class="text-amber-200 text-xs font-bold tracking-[0.2em] uppercase mb-1 drop-shadow-md">Main Story</div>
                        <h3 class="text-white font-extrabold gowun-batang text-3xl drop-shadow-lg">임무 시작</h3>
                    </div>
                    <div class="bg-white/20 p-3 rounded-full shadow-inner">
                        <i data-lucide="navigation" class="text-white w-7 h-7 transform rotate-45 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
                    </div>
                </div>
            </button>
        </div>

        <!-- 상호작용 모달 UI -->
        <div x-show="currentModal !== null" 
             style="display: none;"
             class="absolute inset-0 z-50 flex items-center justify-center pointer-events-auto transition-opacity"
             :class="currentModal === 'PARTY' ? 'party-overlay p-8' : 'bg-black/60 backdrop-blur-md p-4'"
             x-transition.opacity>
             
            <!-- 1. 편성창(PARTY) 4열 그리드 전용 뷰 -->
            <template x-if="currentModal === 'PARTY'">
                <div class="w-full h-full flex flex-col pt-10 px-10">
                    <div class="flex justify-between items-center mb-8">
                        <div>
                            <h2 class="text-4xl font-bold gowun-batang text-white drop-shadow-lg">출진 편성</h2>
                            <p class="text-amber-200/70 text-sm tracking-widest mt-2 uppercase">Formation Setup</p>
                        </div>
                        <button @click="closeModal()" class="text-slate-400 hover:text-white p-3 rounded-full bg-slate-800/50 hover:bg-slate-700 transition"><i data-lucide="x" class="w-6 h-6"></i></button>
                    </div>

                    <!-- 4열 그리드 -->
                    <div class="flex-1 flex gap-6 mt-4">
                        <template x-for="(char, index) in currentParty" :key="index">
                            <div class="roster-card" :class="!char ? 'empty-slot' : ''">
                                <!-- 캐릭터가 빈 슬롯이 아닐 때 -->
                                <template x-if="char !== null">
                                    <div class="w-full h-full relative">
                                        <div class="absolute top-4 left-4 z-10 px-3 py-1 rounded text-xs font-bold text-white shadow-lg" :class="char.color" x-text="char.role"></div>
                                        <img :src="char.src" :alt="char.name">
                                        <div class="roster-info">
                                            <div class="text-amber-300 text-xs tracking-widest mb-1" x-text="char.desc"></div>
                                            <div class="text-3xl font-extrabold text-white gowun-batang drop-shadow-md" x-text="char.name"></div>
                                            <div class="text-slate-400 text-sm font-mono mt-1">Lv. 30 (Max)</div>
                                        </div>
                                    </div>
                                </template>
                                
                                <!-- 캐릭터가 빈 슬롯일 때 -->
                                <template x-if="char === null">
                                    <div class="text-center">
                                        <i data-lucide="plus" class="w-16 h-16 mx-auto mb-4 opacity-50"></i>
                                        <p class="text-sm font-bold tracking-widest uppercase">Select</p>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                    
                    <div class="mt-8 flex justify-center">
                        <button class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 px-16 rounded-full shadow-[0_0_20px_rgba(245,158,11,0.4)] text-lg tracking-widest uppercase transition transform hover:scale-105">
                            저장 및 뒤로가기
                        </button>
                    </div>
                </div>
            </template>

            <!-- 2. 기타 로비 메뉴용 디폴트 뷰 -->
            <template x-if="currentModal !== 'PARTY' && currentModal !== null">
                <div @click.away="closeModal()" class="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-xl w-full text-white overflow-hidden shadow-2xl flex flex-col" style="height: 50vh;">
                    <div class="p-5 border-b border-slate-700/50 flex justify-between items-center bg-slate-800/80">
                        <h3 class="text-xl font-bold gowun-batang text-amber-500" x-text="modalTitle"></h3>
                        <button @click="closeModal()" class="text-slate-400 hover:text-white p-1 rounded-full transition bg-slate-700/50 hover:bg-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="flex-1 p-8 flex flex-col items-center justify-center">
                        <i data-lucide="ghost" class="text-slate-500 w-20 h-20 mb-6 animate-pulse"></i>
                        <h4 class="text-xl font-bold mb-2 tracking-wide text-slate-100">공사 중</h4>
                        <p class="text-slate-400 font-mono text-sm text-center" x-text="`[ ${modalTitle} ] 공간을 현재 구축하고 있습니다.`"></p>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <script src="/js/lobby.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            
            // 벛꽃 파티클 생성 로직
            const container = document.getElementById('particle-container');
            const particleCount = 20; // 파티클 갯수
            for (let i = 0; i < particleCount; i++) {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.width = (Math.random() * 8 + 6) + 'px';
                petal.style.height = (Math.random() * 6 + 4) + 'px';
                
                const fallDuration = (Math.random() * 8 + 5) + 's';
                const swayDuration = (Math.random() * 4 + 2) + 's';
                const delay = (Math.random() * 10) + 's';
                
                petal.style.animationName = 'fall, sway';
                petal.style.animationDuration = `${fallDuration}, ${swayDuration}`;
                petal.style.animationDelay = `${delay}, 0s`;
                
                container.appendChild(petal);
            }
        });
    </script>
</body>
</html>
