<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>튜토리얼 - 첫 전투</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #020617; font-family: 'Pretendard', sans-serif; }
        .gowun-batang { font-family: 'Gowun Batang', serif; }

        /* Bento Grid Layout */
        .bento-container {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            grid-template-rows: 1fr 200px;
            gap: 1rem;
            width: 100vw;
            height: 100vh;
            padding: 1rem;
        }

        /* 반응형: 모바일에서는 세로 배치 */
        @media (max-width: 1024px) {
            .bento-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto auto;
                height: 100svh;
                overflow-y: auto;
            }
        }

        .bento-box {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 1rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 턴 큐박스 (왼쪽) */
        .turn-queue {
            grid-column: 1 / 2;
            grid-row: 1 / 3;
        }
        @media (max-width: 1024px) { .turn-queue { grid-column: 1; grid-row: 1; height: 100px; flex-direction: row; overflow-x: auto;} }

        /* 전장 뷰 (가운데 위) */
        .battle-view {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
        }
        @media (max-width: 1024px) { .battle-view { grid-column: 1; grid-row: 2; height: 40vh; } }

        /* 전투 로그창 (오른쪽 위) */
        .combat-log {
            grid-column: 3 / 4;
            grid-row: 1 / 2;
        }
        @media (max-width: 1024px) { .combat-log { grid-column: 1; grid-row: 3; height: 15vh; } }

        /* 컨트롤 패널 (오른쪽+가운데 아래) */
        .control-panel {
            grid-column: 2 / 4;
            grid-row: 2 / 3;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
        }
        @media (max-width: 1024px) { .control-panel { grid-column: 1; grid-row: 4; height: auto; } }

        /* --- 전투 이펙트 --- */
        .hit-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-4px, 0, 0); }
            20%, 80% { transform: translate3d(6px, 0, 0); filter: brightness(2) drop-shadow(0 0 10px red); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        /* 궁극기(제황검형) 이펙트 - 화면 갈라짐 */
        .slash-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #fbbf24, #fff, #fbbf24, transparent);
            box-shadow: 0 0 20px #fbbf24, 0 0 40px #f59e0b;
            transform: translate(-50%, -50%) rotate(-45deg) scaleX(0);
            transform-origin: center;
            animation: slash 0.6s ease-in-out forwards;
            pointer-events: none;
            z-index: 50;
        }
        @keyframes slash {
            0% { transform: translate(-50%, -50%) rotate(-45deg) scaleX(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) rotate(-45deg) scaleX(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) rotate(-45deg) scaleX(1.5); opacity: 0; height: 2px;}
        }

        /* 궁극기(빙백신검) 이펙트 - 얼음 폭발 */
        .ice-explosion {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #bae6fd 10%, #0ea5e9 50%, transparent 80%);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: freezeBurst 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: none;
            z-index: 50;
            mix-blend-mode: screen;
        }
        @keyframes freezeBurst {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            70% { transform: translate(-50%, -50%) scale(2); opacity: 0.8; backdrop-filter: grayscale(1); }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }

        /* 데미지 텍스트 팝업 */
        .dmg-text {
            position: absolute;
            font-size: 3rem;
            font-weight: 800;
            font-family: 'Gowun Batang', serif;
            color: #ef4444; /* 빨간색 데미지 */
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 20px #ef4444;
            animation: floatUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            pointer-events: none;
            z-index: 60;
        }
        .dmg-text.critical {
            font-size: 5rem;
            color: #fbbf24;
            text-shadow: 2px 2px 0 #000, 0 0 30px #f59e0b;
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
            15% { opacity: 1; transform: translate(-50%, -30px) scale(1.2); }
            30% { transform: translate(-50%, -40px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -80px) scale(1); }
        }

        /* 초상화 빛남 애니메이션 (현재 턴) */
        .active-turn {
            box-shadow: 0 0 15px #38bdf8;
            border-color: #7dd3fc !important;
            transform: scale(1.05);
            transition: all 0.3s;
        }

        /* 버튼 펄스 효과 (궁극기 유도) */
        .pulse-ult {
            animation: pulse-border 1.5s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        /* 화면 전체 화이트 아웃 (승리 시) */
        .white-out {
            position: absolute;
            inset: 0;
            background: white;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease-in-out;
        }
        .white-out.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 스크롤바 숨기기 (로그에만 적용) */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body x-data="battleApp()">

    <div class="bento-container">
        
        <!-- ================= [1] 턴 큐 (좌측) ================= -->
        <div class="bento-box turn-queue p-4 flex flex-col md:flex-col lg:flex-col items-center gap-4">
            <h2 class="text-slate-400 font-bold text-sm uppercase tracking-widest hidden lg:block mb-2">Turn Order</h2>
            
            <template x-for="(entity, idx) in turnQueue" :key="idx">
                <div class="w-16 h-16 rounded-full border-2 border-slate-600 bg-slate-800 flex items-center justify-center shrink-0 relative transition-all"
                     :class="entity.isActive ? 'active-turn' : ''">
                    <img :src="entity.portrait" class="w-12 h-12 object-cover rounded-full">
                    <!-- 행동 게이지바 느낌 (단순 스타일링) -->
                    <div class="absolute -bottom-2 w-10 h-1.5 bg-slate-700 mx-auto rounded overflow-hidden">
                        <div class="bg-sky-400 h-full" :style="`width: ${entity.isActive ? '100%' : '30%'}`"></div>
                    </div>
                </div>
            </template>
        </div>

        <!-- ================= [2] 전투 뷰 (중앙) ================= -->
        <div class="bento-box battle-view flex items-center justify-center">
            
            <!-- 적군 렌더링 컨테이너 -->
            <div id="enemy-container" class="relative transition-transform duration-300" :class="{ 'opacity-0 scale-95': enemy.isDead }">
                <!-- 몬스터 초상화 (임시) -->
                <div class="w-32 h-32 bg-red-900/30 rounded border border-red-800 flex items-center justify-center shadow-[0_0_30px_rgba(153,27,27,0.4)]">
                    <img src="/images/portrait_guard.png" class="w-full h-full hue-rotate-180 brightness-75 object-cover">
                </div>
                <!-- 몬스터 체력 바 -->
                <div class="mt-4 w-full h-3 bg-slate-800 rounded-full border border-slate-600 overflow-hidden relative">
                    <div class="absolute top-0 bottom-0 left-0 bg-red-500 transition-all duration-300 ease-out"
                         :style="`width: ${(enemy.hp / enemy.maxHp) * 100}%`"></div>
                </div>
                <div class="text-center text-xs text-red-300 mt-1" x-text="`${enemy.name}`"></div>

                <!-- 데미지 팝업 컨테이너 (JS에서 주입) -->
                <div id="damage-layer" class="absolute inset-0 z-50"></div>
                
                <!-- 스킬 이펙트 주입 공간 -->
                <div id="effect-layer" class="absolute inset-0 pointer-events-none"></div>
            </div>

        </div>

        <!-- ================= [3] 전투 로그 (우측) ================= -->
        <div class="bento-box combat-log relative">
            <div class="bg-gradient-to-b from-slate-800/80 to-transparent p-3 border-b border-slate-700/50 absolute top-0 inset-x-0 z-10">
                <h2 class="text-slate-300 font-bold text-sm tracking-widest flex items-center gap-2"><i data-lucide="scrollText" class="w-4 h-4"></i> Battle Log</h2>
            </div>
            <div id="log-container" class="p-4 pt-14 h-full overflow-y-auto no-scrollbar flex flex-col gap-2">
                <template x-for="(log, idx) in logs" :key="idx">
                    <div class="text-sm font-myeongjo animate-[fadeIn_0.3s_ease-out]"
                         :class="{
                             'text-emerald-400': log.type === 'player',
                             'text-red-400': log.type === 'enemy',
                             'text-amber-400': log.type === 'skill',
                             'text-slate-400': log.type === 'system'
                         }">
                        <span x-text="log.time" class="text-xs text-slate-500 mr-2 opacity-50"></span>
                        <span x-text="log.message"></span>
                    </div>
                </template>
            </div>
        </div>

        <!-- ================= [4] 컨트롤 패널 (하단) ================= -->
        <div class="bento-box control-panel p-4 flex flex-col md:flex-row gap-6 relative">
            
            <!-- 플레이어 스테이터스 -->
            <div class="flex-none w-full md:w-64 border-b md:border-b-0 md:border-r border-slate-600/50 pb-4 md:pb-0 md:pr-4 flex items-center gap-4">
                <div class="w-16 h-16 rounded-lg bg-slate-800 border border-slate-500 overflow-hidden shrink-0">
                    <img :src="playerGender === 'MALE' ? '/images/portrait_male.png' : '/images/portrait_female.png'" class="w-full h-full object-cover">
                </div>
                <div class="flex-grow flex flex-col gap-2">
                    <div class="font-bold text-white text-lg" x-text="playerNickname"></div>
                    <!-- HP -->
                    <div class="w-full h-3 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                        <div class="bg-emerald-500 h-full transition-all duration-300" :style="`width: ${(player.hp / player.maxHp) * 100}%`"></div>
                    </div>
                    <!-- MP(내력) -->
                    <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                        <div class="bg-blue-500 h-full transition-all duration-300" :style="`width: 100%`"></div>
                    </div>
                </div>
            </div>

            <!-- 스킬 커맨드 덱 -->
            <div class="flex-grow grid grid-cols-2 lg:grid-cols-4 gap-3 items-center">
                
                <!-- 기본 공격 -->
                <button @click="executeAction('ATTACK')" :disabled="!isPlayerTurn || gameState !== 'WAITING_INPUT'"
                        class="h-16 bg-slate-800/80 hover:bg-slate-700 border border-slate-600 rounded-xl transition text-slate-200 font-bold flex flex-col items-center justify-center gap-1 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="sword" class="w-5 h-5"></i>
                    <span class="text-xs">기본 공격</span>
                </button>

                <!-- 궁극기 (빛남 연출) -->
                <button @click="executeAction('SKILL')" :disabled="!isPlayerTurn || gameState !== 'WAITING_INPUT'"
                        class="h-16 bg-gradient-to-t from-amber-900 to-amber-700 border-2 border-amber-500 rounded-xl transition text-white font-bold flex flex-col items-center justify-center gap-1 shadow-[0_0_15px_rgba(245,158,11,0.4)] disabled:opacity-50 disabled:cursor-not-allowed"
                        :class="{ 'pulse-ult': isPlayerTurn && gameState === 'WAITING_INPUT' }">
                    <i data-lucide="zap" class="w-5 h-5 text-amber-300"></i>
                    <span class="text-xs gowun-batang tracking-widest text-amber-200" x-text="ultName"></span>
                </button>

                <!-- 방어 -->
                <button @click="executeAction('DEFEND')" :disabled="!isPlayerTurn || gameState !== 'WAITING_INPUT'"
                        class="h-16 bg-slate-800/80 hover:bg-slate-700 border border-slate-600 rounded-xl transition text-slate-200 font-bold flex flex-col items-center justify-center gap-1 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="shield" class="w-5 h-5 text-sky-400"></i>
                    <span class="text-xs">방어</span>
                </button>

                <!-- 도망 (잠김) -->
                <button disabled="true"
                        class="h-16 bg-slate-900 border border-slate-800 rounded-xl text-slate-600 font-bold flex flex-col items-center justify-center gap-1 cursor-not-allowed cursor-not-allowed opacity-50 relative overflow-hidden">
                    <i data-lucide="footprints" class="w-5 h-5"></i>
                    <span class="text-xs">도망치기</span>
                    <div class="absolute inset-0 bg-[repeating-linear-gradient(45deg,transparent,transparent_10px,rgba(0,0,0,0.5)_10px,rgba(0,0,0,0.5)_20px)]"></div>
                </button>

            </div>

            <!-- 전투 불가능 덮개 (비활성 턴일 때 투명 레이어로 블로킹) -->
            <div class="absolute inset-0 backdrop-blur-[1px] bg-black/20 rounded-xl z-10 flex items-center justify-center" 
                 x-show="!isPlayerTurn || gameState !== 'WAITING_INPUT'" x-transition.opacity>
                <!-- <span class="bg-slate-800/80 px-4 py-1 rounded-full text-slate-300 text-sm font-bold shadow animate-pulse">대기 중...</span> -->
            </div>

        </div>
    </div>

    <!-- 승리 클리어 암전 -->
    <div id="whiteOut" class="white-out flex flex-col items-center justify-center gap-4">
        <h1 class="gowun-batang text-5xl text-amber-500 font-bold">전투 승리</h1>
        <p class="text-slate-600 font-myeongjo">무림맹 본산으로 이동합니다...</p>
    </div>

    <!-- Alpine.js & Logic -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/js/battle_tutorial.js"></script>
    <script> lucide.createIcons(); </script>

</body>
</html>
