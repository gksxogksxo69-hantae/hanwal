<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한월(韓月) - 로비</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        *{box-sizing:border-box}
        body{margin:0;overflow:hidden;background:#0a0e1a;font-family:'Pretendard',sans-serif;color:#fff}
        .serif{font-family:'Gowun Batang',serif}

        /* 배경: 단순 이미지 + 다크 오버레이 (블러 X) */
        .bg-layer{position:absolute;inset:0;z-index:0}
        .bg-layer img{width:100%;height:100%;object-fit:cover;opacity:.45}

        /* 캐릭터 마스크 */
        .char-wrap{
            position:absolute;bottom:0;left:50%;transform:translateX(-55%);
            height:92vh;z-index:2;pointer-events:none;
            -webkit-mask-image:linear-gradient(to bottom,#000 65%,transparent);
            mask-image:linear-gradient(to bottom,#000 65%,transparent);
        }
        .char-wrap img{height:100%;object-fit:contain}

        /* 공통 패널 */
        .panel{background:rgba(10,14,26,.8);border:1px solid rgba(255,255,255,.08);border-radius:9999px}
        .panel-box{background:rgba(10,14,26,.85);border:1px solid rgba(255,255,255,.08);border-radius:12px}

        /* 상단 네비게이션 버튼 */
        .top-nav-btn {
            position: relative; width: 46px; height: 46px; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: rgba(255,255,255,.7); cursor: pointer;
            background: rgba(10,14,26,.65); border: 1px solid rgba(255,255,255,.1);
            transition: all .2s;
            backdrop-filter: blur(4px);
        }
        .top-nav-btn:hover { background: rgba(255,255,255,.15); color: #fff; transform: translateY(-2px); border-color: rgba(255,255,255,.3); }
        .top-nav-btn i { margin-bottom: 2px; }
        .top-nav-label { font-size: 0.65rem; font-weight: 700; letter-spacing: -0.5px; opacity: 0.8; }
        .top-nav-btn:hover .top-nav-label { opacity: 1; }

        /* 스큐 버튼 */
        .skew{transform:skewX(-12deg);transition:background .15s}
        .skew-inner{transform:skewX(12deg)}
        .btn-main{background:#b45309;border-right:3px solid #fbbf24}
        .btn-main:hover{background:#d97706}
        .btn-sub{background:rgba(20,27,45,.95);border:1px solid rgba(255,255,255,.08);border-right:3px solid #a78bfa}
        .btn-sub:hover{background:rgba(40,50,70,.95)}

        /* 편성 카드 */
        .r-card{
            flex:1;position:relative;border-radius:8px;overflow:hidden;
            background:rgba(15,20,30,.95);border:1px solid rgba(255,255,255,.06);
            cursor:pointer;transition:transform .15s,border-color .15s;
        }
        .r-card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.25)}
        .r-card img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
        .r-card-info{
            position:absolute;bottom:0;left:0;right:0;padding:24px 16px 16px;
            background:linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,.3) 80%,transparent);
        }
        .r-empty{
            display:flex;align-items:center;justify-content:center;flex-direction:column;
            color:rgba(255,255,255,.2);border:2px dashed rgba(255,255,255,.15);
        }
        .r-empty:hover{border-style:solid;color:rgba(255,255,255,.5);background:rgba(255,255,255,.03)}

        /* 가이드라인 펴스/글로우 애니메이션 */
        @keyframes guidePulse {
            0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.7); }
            70% { box-shadow: 0 0 0 15px rgba(59,130,246,0); }
            100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); }
        }
        @keyframes guideGlow {
            0% { box-shadow: 0 0 0 0 rgba(245,158,11,0.7); }
            70% { box-shadow: 0 0 0 18px rgba(245,158,11,0); }
            100% { box-shadow: 0 0 0 0 rgba(245,158,11,0); }
        }
        .guide-pulse { animation: guidePulse 1.5s infinite; position: relative; z-index: 60; }
        .guide-glow { animation: guideGlow 1.5s infinite; position: relative; z-index: 60; }
    </style>
</head>
<body x-data="lobbyApp()">

<!-- 배경 -->
<div class="bg-layer">
    <img src="/images/bg_mainss.png" alt="bg" loading="eager">
</div>

<!-- 로딩 스피너 -->
<div x-show="isLoading" class="fixed inset-0 z-[100] bg-[#0a0e1a] flex items-center justify-center">
    <div class="text-center">
        <div class="w-10 h-10 border-2 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-slate-400 text-sm tracking-widest serif">입장 중...</p>
    </div>
</div>

<!-- 캐릭터 -->
<div class="char-wrap">
    <img :src="currentLobbyCharacter.src" :alt="currentLobbyCharacter.name" loading="lazy">
</div>

<!-- 캐릭터 정보 (제거됨) -->

<!-- UI 오버레이 -->
<div class="relative z-10 w-screen h-screen flex flex-col justify-between pointer-events-none" x-show="!isLoading">

    <!-- 상단 헤더 -->
    <header class="flex justify-between items-start p-5 pointer-events-auto">
        <button @click="openModal('MY_PROFILE')" class="panel pr-5 pl-2 py-1.5 flex items-center gap-3 cursor-pointer hover:bg-white/10 transition text-left">
            <div class="w-11 h-11 rounded-full border border-amber-500 overflow-hidden bg-black/60 shrink-0">
                <img :src="playerPortrait" alt="avatar" class="w-full h-full object-cover">
            </div>
            <div>
                <div class="flex items-center gap-1.5">
                    <span class="bg-amber-600 text-[10px] px-1.5 rounded font-bold">Lv.<span x-text="playerLevel"></span></span>
                    <span class="font-bold text-base serif" x-text="playerNickname"></span>
                </div>
                <div class="text-slate-500 text-[10px]">UID: 800012345</div>
            </div>
        </button>

        <div class="flex flex-col items-end gap-3">
            <div class="flex gap-3 items-center">
                <div class="panel px-3.5 py-1 flex items-center gap-1.5">
                    <i data-lucide="coins" class="text-yellow-500 w-3.5 h-3.5"></i>
                    <span class="font-mono text-sm" x-text="playerGold.toLocaleString()"></span>
                </div>
                <div class="panel px-3.5 py-1 flex items-center gap-1.5">
                    <i data-lucide="gem" class="text-cyan-400 w-3.5 h-3.5"></i>
                    <span class="font-mono text-sm" x-text="playerGems.toLocaleString()"></span>
                </div>
                <div class="flex gap-1.5 ml-2">
                    <button class="w-9 h-9 rounded-full bg-black/40 flex items-center justify-center text-slate-400 hover:text-white transition">
                        <i data-lucide="mail" class="w-4 h-4"></i>
                    </button>
                    <button class="w-9 h-9 rounded-full bg-black/40 flex items-center justify-center text-slate-400 hover:text-white transition">
                        <i data-lucide="settings" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- 신규 상단 메뉴 -->
            <div class="flex gap-2">
                <button @click="openModal('GACHA')" class="top-nav-btn group">
                    <i data-lucide="sparkles" class="w-4 h-4 text-amber-300 group-hover:text-amber-400"></i>
                    <span class="top-nav-label text-amber-100">객잔</span>
                </button>
                <button @click="openModal('TOWER')" class="top-nav-btn group">
                    <i data-lucide="castle" class="w-4 h-4 text-cyan-300 group-hover:text-cyan-400"></i>
                    <span class="top-nav-label text-cyan-100">무한탑</span>
                </button>
                <button @click="openModal('RAID')" class="top-nav-btn group">
                    <i data-lucide="flame" class="w-4 h-4 text-red-400 group-hover:text-red-500"></i>
                    <span class="top-nav-label text-red-100">레이드</span>
                </button>
                <button @click="openModal('PARTY')" class="top-nav-btn group" id="btn-party"
                        :class="{'guide-pulse': guideStep === 2}">
                    <i data-lucide="users" class="w-4 h-4 text-blue-300 group-hover:text-blue-400"></i>
                    <span class="top-nav-label text-blue-100">편성</span>
                </button>
                <button @click="openModal('INVENTORY')" class="top-nav-btn group">
                    <i data-lucide="package" class="w-4 h-4 text-slate-300 group-hover:text-white"></i>
                    <span class="top-nav-label text-slate-200">보따리</span>
                </button>
                <button @click="openModal('GUILD')" class="top-nav-btn group">
                    <i data-lucide="shield" class="w-4 h-4 text-green-300 group-hover:text-green-400"></i>
                    <span class="top-nav-label text-green-100">문파</span>
                </button>
            </div>

            <!-- 퀘스트 바 가이드 영역 -->
            <div @click="handleQuestClick()" class="mt-4 flex flex-col items-end group cursor-pointer pointer-events-auto">
                <div class="panel-box px-4 py-2 bg-black/60 border-amber-500/30 flex items-center gap-3 transition-all hover:translate-x-[-4px] shadow-lg"
                     :class="{'animate-pulse border-amber-400 bg-amber-500/10 shadow-[0_0_15px_rgba(245,158,11,0.3)]': currentQuest.status === 'COMPLETED'}">
                    <div class="flex flex-col text-right">
                        <div class="flex items-center justify-end gap-1.5 mb-0.5">
                            <span class="text-[10px] bg-amber-600 px-1.5 rounded font-bold uppercase tracking-widest text-white" 
                                  x-text="currentQuest.status === 'COMPLETED' ? '완료' : '진행 중'"></span>
                            <span class="text-xs font-bold text-slate-400" x-text="currentQuest.title"></span>
                        </div>
                        <div class="text-sm font-bold text-white serif tracking-wide group-hover:text-amber-400 transition-colors" 
                             x-text="currentQuest.status === 'COMPLETED' ? '보상 받기' : currentQuest.goalDesc"></div>
                    </div>
                    <div class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center"
                         :class="{'bg-amber-500/40': currentQuest.status === 'COMPLETED'}">
                        <i data-lucide="gift" class="w-4 h-4 text-amber-500" x-show="currentQuest.status === 'COMPLETED'"></i>
                        <i data-lucide="flag" class="w-4 h-4 text-amber-500" x-show="currentQuest.status !== 'COMPLETED'"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>



    <!-- 우하단 메인 버튼 -->
    <div class="absolute bottom-8 right-0 flex flex-col gap-2.5 pointer-events-auto">
        <button @click="openModal('DAILY_HALL')" class="skew btn-sub w-64 h-14 mr-[-16px] flex items-center justify-end pr-8 cursor-pointer">
            <div class="skew-inner flex items-center gap-3">
                <div class="text-right">
                    <div class="text-purple-300 text-[10px] font-bold tracking-widest uppercase">일일 수련</div>
                    <div class="text-white font-bold serif text-base">기억의 전당</div>
                </div>
                <i data-lucide="swords" class="text-purple-400 w-5 h-5"></i>
            </div>
        </button>
        <button @click="goToStory(); guideCompleteMissionStep()" class="skew btn-main w-72 h-20 mr-[-16px] flex items-center justify-end pr-10 cursor-pointer group" id="btn-mission"
                :class="{'guide-glow': guideStep === 3}">
            <div class="skew-inner flex items-center gap-4">
                <div class="text-right">
                    <div class="text-amber-200 text-[10px] font-bold tracking-[.2em] uppercase">Main Story</div>
                    <div class="text-white font-extrabold serif text-2xl">임무 시작</div>
                </div>
                <i data-lucide="navigation" class="text-white w-6 h-6 rotate-45 transition-transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5"></i>
            </div>
        </button>
    </div>

    <!-- ═════ 가이드라인 오버레이 ═════ -->

    <!-- Step 1: 독백 모달 -->
    <div x-show="guideStep === 1" x-transition.opacity.duration.500ms
         class="fixed inset-0 z-[80] bg-black/85 flex items-center justify-center pointer-events-auto" @click="advanceGuideMonologue()">
        <div class="max-w-lg w-full mx-6">
            <div class="bg-slate-900/90 border border-amber-500/30 rounded-2xl p-8 md:p-10 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-amber-500 to-transparent opacity-50"></div>
                <div class="text-center mb-6">
                    <span class="text-amber-500/60 text-xs tracking-[0.3em] uppercase font-bold">Inner Monologue</span>
                </div>
                <div class="min-h-[80px] flex items-center justify-center">
                    <p class="text-xl md:text-2xl serif text-slate-200 leading-relaxed tracking-wide text-center" x-text="guideMonologueText"></p>
                    <span class="animate-pulse ml-1 w-0.5 h-6 bg-amber-400 inline-block" x-show="guideTyping"></span>
                </div>
                <div class="text-center mt-6">
                    <span class="text-slate-500 text-xs animate-pulse" x-show="!guideTyping">클릭하여 계속</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Step 2: 편성 버튼 하이라이트 툴팁 -->
    <div x-show="guideStep === 2" x-transition.opacity
         class="fixed top-[90px] right-[200px] z-[70] pointer-events-none">
        <div class="bg-slate-900/95 border border-blue-500/50 rounded-xl px-4 py-3 shadow-xl max-w-[200px]">
            <p class="text-blue-300 text-xs font-bold mb-1">파티 편성</p>
            <p class="text-slate-300 text-[11px] leading-relaxed">동료를 편성하여 출진 준비를 하세요!</p>
            <div class="absolute -top-2 right-6 w-4 h-4 bg-slate-900/95 border-l border-t border-blue-500/50 rotate-45"></div>
        </div>
    </div>

    <!-- Step 3: 임무 시작 버튼 하이라이트 툴팁 -->
    <div x-show="guideStep === 3" x-transition.opacity
         class="fixed bottom-[110px] right-[290px] z-[70] pointer-events-none">
        <div class="bg-slate-900/95 border border-amber-500/50 rounded-xl px-4 py-3 shadow-xl max-w-[200px]">
            <p class="text-amber-400 text-xs font-bold mb-1">첫 번째 임무!</p>
            <p class="text-slate-300 text-[11px] leading-relaxed">클릭하여 첫 번째 임무에 도전해 보세요.</p>
            <div class="absolute -bottom-2 right-10 w-4 h-4 bg-slate-900/95 border-r border-b border-amber-500/50 rotate-45"></div>
        </div>
    </div>

    <!-- 가이드 반투명 오버레이 (Step 2, 3에서 배경 어둡게) -->
    <div x-show="guideStep === 2 || guideStep === 3" x-transition.opacity
         class="fixed inset-0 z-[55] bg-black/50 pointer-events-none"></div>

    <!-- 모달 영역 -->
    <div x-show="currentModal" style="display:none"
         class="absolute inset-0 z-50 flex items-center justify-center pointer-events-auto"
         :class="currentModal==='PARTY' ? 'bg-[#060a12]/97 p-6' : 'bg-black/80 p-4'"
         x-transition.opacity.duration.200ms>

        <!-- 편성창 개편 -->
        <template x-if="currentModal==='PARTY'">
            <div class="w-full h-full flex flex-col pt-4 px-8 overflow-hidden">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="text-2xl font-bold serif flex items-center gap-2">
                            <i data-lucide="users" class="text-blue-400"></i> 출진 편성
                        </h2>
                        <p class="text-slate-400 text-xs mt-1">모험에 동행할 4명의 동료를 선택하세요.</p>
                    </div>
                    <div class="flex gap-4">
                        <button @click="saveParty()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-8 rounded-lg text-sm shadow-lg transition">편성 확정</button>
                        <button @click="closeModal()" class="w-10 h-10 rounded-full bg-slate-800/80 border border-white/20 text-slate-300 flex items-center justify-center hover:bg-red-500 hover:text-white hover:border-red-500 transition-all z-10 shadow-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                        </button>
                    </div>
                </div>

                <!-- 상단: 현재 편성 슬롯 (4열) -->
                <div class="grid grid-cols-4 gap-4 mb-8">
                    <template x-for="(char, i) in currentParty" :key="i">
                        <div @click="selectPartySlot(i)"
                             class="aspect-[4/3] rounded-xl border-2 transition-all cursor-pointer flex flex-col items-center justify-center relative overflow-hidden"
                             :class="selectedPartySlot === i ? 'border-blue-500 bg-blue-500/10 shadow-[0_0_15px_rgba(59,130,246,0.3)]' : 'border-white/10 bg-black/40 hover:border-white/30'">
                            
                            <template x-if="char">
                                <div class="w-full h-full relative">
                                    <img :src="char.src" class="w-full h-full object-cover object-top opacity-80">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                                    <div class="absolute bottom-2 left-0 right-0 text-center">
                                        <div class="text-[10px] font-bold text-blue-300 uppercase" x-text="'SLOT ' + (i+1)"></div>
                                        <div class="font-bold serif text-sm text-white" x-text="char.name"></div>
                                    </div>
                                    <!-- 해제 버튼 -->
                                    <button @click.stop="currentParty[i] = null" class="absolute top-2 right-2 w-6 h-6 rounded-full bg-red-500/80 text-white flex items-center justify-center hover:bg-red-600 transition">
                                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            </template>
                            
                            <template x-if="!char">
                                <div class="text-center opacity-40">
                                    <div class="text-[10px] font-bold text-slate-500 mb-1" x-text="'SLOT ' + (i+1)"></div>
                                    <i data-lucide="plus" class="w-8 h-8 mx-auto text-slate-500"></i>
                                    <div class="text-[10px] mt-1 font-bold">대기 중</div>
                                </div>
                            </template>

                            <!-- 선택 표시기 -->
                            <div x-show="selectedPartySlot === i" class="absolute inset-0 border-2 border-blue-400 animate-pulse pointer-events-none"></div>
                        </div>
                    </template>
                </div>

                <!-- 하단: 보유 캐릭터 리스트 (그리드) -->
                <div class="flex-1 flex flex-col overflow-hidden bg-black/40 rounded-t-3xl border-t border-x border-white/5">
                    <div class="p-4 flex items-center justify-between border-b border-white/5">
                        <span class="text-sm font-bold text-slate-400">보유한 동료 목록</span>
                        <div class="text-[10px] text-blue-400 font-bold uppercase tracking-widest">Select to assign to slot <span x-text="selectedPartySlot + 1"></span></div>
                    </div>
                    <div class="flex-1 overflow-y-auto p-4 scrollbar-hide">
                        <div class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3">
                            <template x-for="(char, idx) in myCharacters" :key="idx">
                                <div @click="togglePartyMember(char)"
                                     class="aspect-square rounded-lg border-2 transition-all cursor-pointer relative overflow-hidden group"
                                     :class="currentParty.some(p => p && p.id === char.id) 
                                             ? 'border-blue-500 shadow-lg' 
                                             : 'border-transparent bg-slate-800 hover:border-white/30'">
                                    
                                    <img :src="char.src" class="w-full h-full object-cover object-top" :class="currentParty.some(p => p && p.id === char.id) ? 'opacity-40 grayscale-[0.5]' : 'group-hover:scale-105 transition-transform'">
                                    
                                    <!-- 등급 배지 -->
                                    <div class="absolute top-1 right-1 px-1 rounded bg-black/60 text-[8px] font-bold" :class="char.rarityColor.replace('border-', 'text-')" x-text="char.rarity"></div>
                                    
                                    <!-- 편성됨 표시 -->
                                    <template x-if="currentParty.some(p => p && p.id === char.id)">
                                        <div class="absolute inset-0 flex items-center justify-center bg-blue-500/20">
                                            <div class="bg-blue-600 text-[10px] font-bold px-2 py-0.5 rounded shadow-lg text-white">편성됨</div>
                                        </div>
                                    </template>

                                    <!-- 이름 -->
                                    <div class="absolute bottom-0 left-0 right-0 bg-black/70 py-1 text-center">
                                        <div class="text-[9px] font-bold text-white truncate px-1" x-text="char.name"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- 상세 프로필(상태창) 모달 -->
        <template x-if="currentModal==='MY_PROFILE'">
            <div class="panel-box w-full max-w-5xl flex flex-col overflow-hidden shadow-2xl" @click.away="closeModal()" style="height: 75vh;">
                <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/40">
                    <div>
                        <h2 class="text-3xl font-bold serif flex items-center gap-2">
                            <i data-lucide="award" class="text-amber-400 w-7 h-7"></i> 종합 상태창
                        </h2>

                        <p class="text-slate-400 text-sm mt-1">동료들과 힘을 합쳐 무림을 제패하세요.</p>
                    </div>
                    <button @click="closeModal()" class="w-10 h-10 rounded-full bg-slate-800/80 border border-white/20 text-slate-300 flex items-center justify-center hover:bg-red-500 hover:text-white hover:border-red-500 transition-all z-10 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
                </div>
            </div>
        </template>

        <!-- 무한의 탑 모달 -->
        <template x-if="currentModal==='TOWER'">
            <div class="panel-box w-full max-w-4xl flex flex-col overflow-hidden shadow-2xl" @click.away="closeModal()" style="height: 70vh;">
                <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/40">
                    <div>
                        <h2 class="text-3xl font-bold serif text-cyan-400">무한의 탑 (Infinite Tower)</h2>
                        <p class="text-slate-400 text-sm mt-1">한계를 시험하고 최고의 보상을 쟁취하세요.</p>
                    </div>
                    <button @click="closeModal()" class="w-10 h-10 rounded-full bg-slate-800/80 border border-white/20 text-slate-300 flex items-center justify-center hover:bg-red-500 hover:text-white hover:border-red-500 transition-all z-10 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
                <div class="flex-1 flex flex-col items-center justify-center bg-[#0a0e1a] p-8">
                    <div class="w-32 h-32 rounded-full bg-cyan-500/10 flex items-center justify-center mb-6 border border-cyan-500/30">
                        <i data-lucide="castle" class="w-16 h-16 text-cyan-400"></i>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-2">현재 <span class="text-cyan-400" x-text="towerFloor"></span>층 도전 가능</h3>
                    <p class="text-slate-500 text-sm mb-8 text-center">각 층을 클리어할 때마다 대량의 보석과 성장 재료를 얻을 수 있습니다.</p>
                    <button class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 px-16 rounded-full text-lg shadow-lg transition">탑 입장하기</button>
                </div>
            </div>
        </template>



        <!-- 계정 레벨 달성 보상 모달 -->
        <template x-if="currentModal==='LEVEL_REWARDS'">
            <div class="panel-box w-full max-w-4xl flex flex-col overflow-hidden shadow-2xl relative" @click.away="closeModal()" style="height: 60vh;">
                <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/40">
                    <div>
                        <h2 class="text-2xl lg:text-3xl font-bold serif text-amber-500 flex items-center gap-2">
                             <i data-lucide="scroll-text" class="w-8 h-8"></i> 대협의 성장 기록
                        </h2>
                        <p class="text-slate-400 text-sm mt-1">강해질수록 무림의 보상이 기다립니다.</p>
                    </div>
                    <button @click="closeModal()" class="w-10 h-10 rounded-full bg-slate-800/80 border border-white/20 text-slate-300 flex items-center justify-center hover:bg-red-500 hover:text-white transition-all z-10 shadow-lg">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <div class="flex-1 overflow-x-auto parchment-scroll bg-[#0a0e1a]/80 p-10 flex items-center space-x-6 min-h-[300px]">
                    <template x-for="lv in Array.from({length: 60}, (_, i) => i + 1)" :key="lv">
                        <div class="flex-shrink-0 w-36 aspect-[2/3] relative rounded-xl border-2 transition-all duration-300 flex flex-col items-center justify-between p-4 group"
                             :class="{
                                'bg-gradient-to-b from-amber-600/30 to-slate-900 border-amber-400/60 shadow-[0_0_25px_rgba(245,158,11,0.3)]': lv % 10 === 0,
                                'bg-gradient-to-b from-blue-600/20 to-slate-900 border-blue-400/50 shadow-[0_0_15px_rgba(59,130,246,0.2)]': lv % 5 === 0 && lv % 10 !== 0,
                                'bg-slate-800/40 border-white/10 hover:border-white/30': lv % 5 !== 0,
                                'opacity-40 grayscale-[0.5]': playerLevel < lv
                             }">
                            
                            <!-- 레벨 뱃지 -->
                            <div class="absolute -top-3 left-1/2 -translate-x-1/2 px-3 py-1 bg-slate-950 border rounded-full text-[10px] font-bold font-mono tracking-tighter z-10 whitespace-nowrap"
                                 :class="lv % 5 === 0 ? 'border-amber-500 text-amber-400 shadow-[0_0_10px_rgba(245,158,11,0.5)]' : 'border-white/20 text-slate-400'">
                                LEVEL <span x-text="lv"></span>
                            </div>

                            <!-- 보상 비주얼 -->
                            <div class="flex-1 flex flex-col items-center justify-center w-full">
                                <template x-if="lv % 10 === 0">
                                    <div class="relative flex flex-col items-center">
                                        <div class="absolute inset-0 bg-amber-500 blur-2xl opacity-20 group-hover:opacity-40 transition-opacity"></div>
                                        <i data-lucide="crown" class="w-12 h-12 text-amber-400 mb-2 drop-shadow-[0_0_8px_rgba(245,158,11,0.8)] animate-bounce"></i>
                                        <div class="text-xs text-amber-200 font-bold mb-1">특별 보상</div>
                                    </div>
                                </template>
                                <template x-if="lv % 5 === 0 && lv % 10 !== 0">
                                    <div class="relative flex flex-col items-center">
                                        <i data-lucide="medal" class="w-10 h-10 text-blue-400 mb-2"></i>
                                        <div class="text-[10px] text-blue-300 font-bold mb-1">성장 보상</div>
                                    </div>
                                </template>
                                <template x-if="lv % 5 !== 0">
                                    <i data-lucide="gem" class="w-8 h-8 text-slate-400 mb-2"></i>
                                </template>
                                
                                <div class="flex items-center gap-1.5 mt-2 bg-black/40 px-3 py-1 rounded-full border border-white/5">
                                    <i data-lucide="gem" class="w-3 h-3 text-cyan-400"></i>
                                    <span class="text-sm font-bold text-white font-mono" x-text="`${lv % 10 === 0 ? 600 : (lv % 5 === 0 ? 300 : 100)}`"></span>
                                </div>
                            </div>

                            <!-- 수령 상태 -->
                            <div class="w-full mt-4">
                                <template x-if="isLevelRewardClaimed(lv)">
                                    <div class="w-full py-2 flex items-center justify-center gap-1 text-[10px] font-bold text-emerald-400 bg-emerald-500/10 rounded-lg border border-emerald-500/30">
                                        <i data-lucide="check-circle" class="w-3 h-3"></i> 수령 완료
                                    </div>
                                </template>
                                <template x-if="!isLevelRewardClaimed(lv)">
                                    <button @click="claimLevelReward(lv)"
                                            :disabled="playerLevel < lv"
                                            class="w-full py-2 rounded-lg text-[10px] font-bold transition-all shadow-md active:scale-95 disabled:opacity-50 disabled:grayscale disabled:cursor-not-allowed"
                                            :class="{
                                                'bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-black': playerLevel >= lv,
                                                'bg-slate-700 text-slate-500 border border-white/10': playerLevel < lv
                                            }">
                                        <span x-text="playerLevel < lv ? '달성 미달' : '보상 받기'"></span>
                                    </button>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
                
                <div class="p-3 bg-black/40 border-t border-white/5 flex justify-center text-slate-500 text-[10px] items-center gap-2">
                    <i data-lucide="mouse-pointer-2" class="w-3 h-3"></i> 좌우로 드래그(시프트+휠)하여 모든 레벨 보상을 확인하세요.
                </div>
            </div>
        </template>
            <div class="panel-box w-full max-w-2xl flex flex-col overflow-hidden shadow-2xl" @click.away="closeModal()" style="height: 60vh;">
                <div class="p-5 border-b border-white/10 flex justify-between items-center bg-blue-600/20">
                    <h2 class="text-xl font-bold serif text-blue-400 flex items-center gap-2">
                        <i data-lucide="map"></i> 천하 여정: 보상 수령
                    </h2>
                    <button @click="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
                </div>
                <div class="p-6 overflow-y-auto bg-slate-900/50 flex-1">
                    <div class="grid grid-cols-1 gap-4">
                        <template x-for="act in [1, 2, 3, 4, 5, 6, 7, 8]" :key="act">
                            <div class="panel-box p-4 flex items-center justify-between bg-slate-800/60 border-white/10 transition hover:border-blue-500/30">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 rounded-lg bg-black/40 flex items-center justify-center border border-white/5">
                                        <span class="text-lg font-bold text-blue-400" x-text="act"></span>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-white" x-text="act + '막: 대모험의 시작'"></h4>
                                        <p class="text-[10px] text-slate-500">각 막의 최종 시련을 극복하고 보상을 쟁취하세요.</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-4">
                                    <div class="text-right mr-2">
                                        <div class="text-[10px] text-amber-400 font-bold">1,500 보석</div>
                                    </div>
                                    
                                    <!-- 수령 완료 상태 -->
                                    <template x-if="isActClaimed(act)">
                                        <div class="px-6 py-2 rounded-lg bg-slate-700 text-slate-500 font-bold text-sm cursor-not-allowed border border-white/5">
                                            수령 완료
                                        </div>
                                    </template>
                                    
                                    <!-- 수령 가능 상태 -->
                                    <template x-if="!isActClaimed(act) && canClaimAct(act)">
                                        <button @click="claimActReward(act)" class="px-6 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm shadow-lg transition transform active:scale-95 animate-pulse">
                                            받기
                                        </button>
                                    </template>
                                    
                                    <!-- 아직 클리어 전 -->
                                    <template x-if="!isActClaimed(act) && !canClaimAct(act)">
                                        <div class="px-6 py-2 rounded-lg bg-black/40 text-slate-600 font-bold text-sm border border-white/5 opacity-50">
                                            미달성
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- 퀘스트 보상 수령 모달 -->
        <template x-if="currentModal==='QUEST_REWARD'">
            <div class="panel-box w-full max-w-md flex flex-col overflow-hidden shadow-2xl animate-bounce-short" @click.away="closeModal()">
                <div class="p-5 border-b border-white/10 flex justify-between items-center bg-amber-600/20">
                    <h2 class="text-xl font-bold serif text-amber-400 flex items-center gap-2">
                        <i data-lucide="gift"></i> 임무 완수 보상
                    </h2>
                    <button @click="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
                </div>
                <div class="p-8 flex flex-col items-center">
                    <div class="w-20 h-20 bg-amber-500/10 rounded-full flex items-center justify-center mb-4 border border-amber-500/30">
                        <i data-lucide="gem" class="w-10 h-10 text-cyan-400"></i>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-1" x-text="currentQuest.title"></h3>
                    <p class="text-slate-400 text-sm mb-6 text-center">임무를 성공적으로 마쳤습니다!<br>아래 보상을 수령하시겠습니까?</p>
                    
                    <div class="w-full bg-black/40 rounded-lg p-4 mb-8 flex justify-center gap-6">
                        <div class="flex items-center gap-2">
                            <i data-lucide="coins" class="text-yellow-500 w-4 h-4"></i>
                            <span class="font-mono font-bold" x-text="currentQuest.rewardGold.toLocaleString()"></span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i data-lucide="gem" class="text-cyan-400 w-4 h-4"></i>
                            <span class="font-mono font-bold" x-text="currentQuest.rewardGems.toLocaleString()"></span>
                        </div>
                    </div>
                    
                    <button @click="claimQuestReward()" class="w-full py-4 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95">
                        보상 수령하기
                    </button>
                </div>
            </div>
        </template>

        <!-- 기타 모달 -->
        <template x-if="currentModal && !['PARTY', 'MY_PROFILE', 'PROFILE_EDIT', 'GACHA', 'INVENTORY', 'DAILY_HALL', 'STORY_SELECT', 'GUILD', 'TOWER', 'RAID', 'QUEST_REWARD'].includes(currentModal)">
            <div @click.away="closeModal()" class="panel-box max-w-md w-full overflow-hidden shadow-xl" style="height:45vh">
                <div class="p-4 border-b border-white/5 flex justify-between items-center bg-black/30">
                    <h3 class="text-lg font-bold serif text-amber-500" x-text="modalTitle"></h3>
                    <button @click="closeModal()" class="w-8 h-8 rounded-full bg-slate-800/80 border border-white/20 text-slate-300 flex items-center justify-center hover:bg-red-500 hover:text-white hover:border-red-500 transition-all z-10 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
                <div class="flex-1 p-6 flex flex-col items-center justify-center h-full">
                    <i data-lucide="ghost" class="text-slate-600 w-16 h-16 mb-4"></i>
                    <h4 class="font-bold mb-1">공사 중</h4>
                    <p class="text-slate-500 text-sm text-center" x-text="'[ '+modalTitle+' ] 구현 예정'"></p>
                </div>
            </div>
        </template>
    </div>
</div>

<script src="/js/lobby.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>lucide.createIcons())</script>
</body>
</html>
